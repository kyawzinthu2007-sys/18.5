              {selectedPlan && paymentMethod && (
                <div className="rounded-xl bg-violet-50 border border-violet-100 p-4 text-sm">
                  <p className="font-bold text-slate-800">Send exactly {selectedPlan.priceKyat.toLocaleString()} Ks via {paymentMethod}</p>
                  <p className="text-slate-600 mt-1">To account number: <span className="font-mono font-extrabold text-violet-700">{info.accountNumber}</span></p>
                  <p className="text-xs text-slate-500 mt-2">After paying, take a screenshot of the confirmation and upload it below. Turbo will be activated for {selectedPlan.days} days once a creator verifies the payment.</p>
                </div>
              )}

              <PaymentScreenshotField value={screenshot} onChange={setScreenshot} />

              {error && <p className="text-sm font-semibold text-red-600 bg-red-50 rounded-xl p-3">{error}</p>}
              {success && <p className="text-sm font-semibold text-emerald-700 bg-emerald-50 rounded-xl p-3">{success}</p>}

              <Button type="submit" disabled={submitting}>{submitting ? "Submitting…" : "Submit payment for review"}</Button>
            </form>
          )}

          {user && purchases.length > 0 && (
            <div className="mt-7 pt-6 border-t border-slate-100">
              <h3 className="font-bold text-slate-800 mb-3">Your Turbo subscription requests</h3>
              <div className="divide-y divide-slate-100">
                {purchases.map(p => (
                  <div key={p.id} className="py-3 flex items-center justify-between gap-3">
                    <div>
                      <p className="font-semibold text-slate-800">{p.days} days · {p.priceKyat.toLocaleString()} Ks · {p.paymentMethod}</p>
                      <p className="text-xs text-slate-400">{fmtDate(p.createdAt)}</p>
                      {p.status === "rejected" && p.rejectionReason && <p className="text-xs text-red-600 mt-1">{p.rejectionReason}</p>}
                    </div>
                    <Badge tone={p.status === "approved" ? "green" : p.status === "rejected" ? "slate" : "amber"}>{p.status}</Badge>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function TSOHistoryPanel({ user, isAdmin, adminUsername, adminPassword, onClose, onRestore }) {
  const [messages, setMessages] = useState([]);
  const [usage, setUsage] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [clearing, setClearing] = useState(false);

  const authParams = () => isAdmin
    ? { adminUsername, adminPassword }
    : { token: user.token };

  async function load() {
    setLoading(true); setError("");
    const res = await api("/ai/history?" + new URLSearchParams(authParams()).toString());
    setLoading(false);
    if (res.ok) { setMessages(res.messages || []); setUsage(res.usage || null); }
    else setError(res.error || "Couldn't load your chat history.");
  }
  useEffect(() => { load(); }, []);

  async function clearAll() {
    if (!window.confirm("Clear your entire TSO chat history? This can't be undone.")) return;
    setClearing(true);
    const res = await api("/ai/history", { method: "DELETE", body: JSON.stringify(authParams()) });
    setClearing(false);
    if (res.ok) { setMessages([]); if (usage) setUsage({ ...usage, usedBytes: 0 }); }
    else setError(res.error || "Couldn't clear your history.");
  }

  function fmtBytes(n) {
    if (n >= 1024 * 1024 * 1024) return (n / (1024 * 1024 * 1024)).toFixed(2) + " GB";
    if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + " MB";
    if (n >= 1024) return (n / 1024).toFixed(0) + " KB";
    return n + " B";
  }

  // Group messages into day headers for readability.
  const groups = [];
  for (const m of messages) {
    const day = m.createdAt ? new Date(m.createdAt).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "Earlier";
    let group = groups.find(g => g.day === day);
    if (!group) { group = { day, items: [] }; groups.push(group); }
    group.items.push(m);
  }

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 p-0 sm:p-4">
      <div className="bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg max-h-[85vh] flex flex-col">
        <div className="border-b border-slate-100 px-5 py-4 flex items-center justify-between shrink-0">
          <div className="flex items-center gap-2">
            <span className="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-600"><Icon path={ICONS.history} size={16} /></span>
            <h2 className="font-extrabold text-slate-900">Chat history</h2>
          </div>
          <button type="button" onClick={onClose} className="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500"><Icon path={ICONS.close} size={16} /></button>
        </div>

        {usage && (
          <div className="px-5 pt-3 pb-1 shrink-0">
            <div className="flex items-center justify-between text-[11px] font-semibold text-slate-500 mb-1">
              <span>{fmtBytes(usage.usedBytes)} of {fmtBytes(usage.quotaBytes)} used</span>
              <span className={`inline-flex items-center gap-1 ${usage.turboQuota ? "text-violet-600" : "text-slate-400"}`}>
                {usage.turboQuota && <Icon path={ICONS.bolt} size={10} />}
                {usage.turboQuota ? "1 GB (Turbo)" : "500 MB (Free)"}
              </span>
            </div>
            <div className="h-1.5 rounded-full bg-slate-100 overflow-hidden">
              <div className={`h-full rounded-full ${usage.turboQuota ? "bg-violet-500" : "bg-slate-400"}`}
                style={{ width: `${Math.min(100, (usage.usedBytes / usage.quotaBytes) * 100)}%` }} />
            </div>
            {!usage.turboQuota && (
              <p className="text-[10px] text-slate-400 mt-1">Turbo subscribers get 1 GB of history storage — it drops back to 500 MB if your subscription lapses.</p>
            )}
          </div>
        )}

        <div className="flex-1 overflow-y-auto px-5 py-4">
          {loading ? <p className="text-sm text-slate-400 text-center py-8">Loading your history…</p> :
           error ? <p className="text-sm font-semibold text-red-600 bg-red-50 rounded-xl p-3">{error}</p> :
           messages.length === 0 ? (
            <div className="text-center py-10">
              <div className="text-3xl mb-2">🕓</div>
              <p className="font-bold text-slate-700">No chat history yet</p>
              <p className="text-sm text-slate-400 mt-1">Conversations you have with TSO will show up here.</p>
            </div>
           ) : (
            <div className="space-y-5">
              {groups.map(g => (
                <div key={g.day}>
                  <div className="text-[11px] font-bold uppercase tracking-wide text-slate-400 mb-2">{g.day}</div>
                  <div className="space-y-2">
                    {g.items.map(m => (
                      <div key={m.id} className={`rounded-xl px-3.5 py-2.5 text-sm ${m.role === "user" ? "bg-violet-50 text-violet-900" : "bg-slate-50 text-slate-700"}`}>
                        <div className="flex items-center gap-1.5 mb-0.5">
                          <span className="text-[10px] font-extrabold uppercase tracking-wide text-slate-400">{m.role === "user" ? "You" : "TSO"}</span>
                          {m.role === "tso" && m.engine === "turbo" && <Icon path={ICONS.bolt} size={10} className="text-violet-500" />}
                        </div>
                        <div className="whitespace-pre-line">{m.text}</div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
           )}
        </div>

        {messages.length > 0 && (
          <div className="border-t border-slate-100 px-5 py-3 flex items-center justify-between shrink-0">
            <button type="button" onClick={clearAll} disabled={clearing} className="text-xs font-bold text-red-600 hover:text-red-700 disabled:opacity-50">
              {clearing ? "Clearing…" : "Clear all history"}
            </button>
            {onRestore && (
              <Button variant="ghost" onClick={() => { onRestore(messages); onClose(); }}>Continue in chat</Button>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function TSOAIPage({ isAdmin, adminUsername, adminPassword, user }) {
  const [messages, setMessages] = useState(() => [
    { role: "tso", text: "Hi, I'm TSO AI! Ask me anything, attach a photo, video, or file for me to look at, or ask me to create an image for you." }
  ]);
  const [input, setInput] = useState("");
  const [pendingAttachments, setPendingAttachments] = useState([]);
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");
  const [imageMode, setImageMode] = useState(false);
  const [imageOptionsOpen, setImageOptionsOpen] = useState(false);
  const [imageNegativePrompt, setImageNegativePrompt] = useState("");
  const [imageAspectRatio, setImageAspectRatio] = useState("square");
  const [imageQuality, setImageQuality] = useState("balanced"); // "fast" | "balanced" | "detailed" -> steps
  const [imageEnhance, setImageEnhance] = useState(true); // let TSO expand terse prompts for precision
  const [attachError, setAttachError] = useState("");
  const scrollRef = useRef(null);
  const fileInputRef = useRef(null);
  const [plusOpen, setPlusOpen] = useState(false);
  const [engine, setEngine] = useState("neo");
  const [turboActive, setTurboActive] = useState(false);
  const [turboExpiresAt, setTurboExpiresAt] = useState(null);
  const [showTurboModal, setShowTurboModal] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const [researchMode, setResearchMode] = useState(null); // null | "quick" | "research" | "deep"
  const [showResearchPicker, setShowResearchPicker] = useState(false);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, sending]);

  async function loadTurboStatus() {
    if (isAdmin) { setTurboActive(true); return; } // creators always have Turbo
    if (!user) { setTurboActive(false); return; }
    const res = await api("/turbo/status?token=" + encodeURIComponent(user.token));
    if (res.ok) { setTurboActive(!!res.active); setTurboExpiresAt(res.expiresAt || null); }
  }
  useEffect(() => { loadTurboStatus(); }, [user, isAdmin]);

  function selectEngine(next) {
    if (next === "turbo" && !turboActive) {
      setShowTurboModal(true);
      return;
    }
    setEngine(next);
  }

  function handleTurboSubscribed() {
    // Purchase request submitted — Turbo activates once a creator approves
    // it, so just re-check status; keep the modal open to show the pending
    // request in the list.
    loadTurboStatus();
  }

  function openResearchPicker() {
    if (!turboActive) { setShowTurboModal(true); return; }
    setEngine("turbo");
    setShowResearchPicker(true);
  }

  function pickResearchMode(mode) {
    setResearchMode(mode);
    setShowResearchPicker(false);
  }

  // ---------------------------------------------------------------------
  // Slash commands — every Turbo feature (Daily Brief, Research, Visualize,
  // Translate, Memory, Projects, Tools) is reachable straight from the
  // search box instead of separate icon buttons. Typing "/" opens a small
  // command menu; picking one (or typing it out, e.g. "/translate hello")
  // runs it and drops the result into the chat as a normal message.
  // ---------------------------------------------------------------------
  const SLASH_COMMANDS = [
    { cmd: "brief", label: "🌅 Daily Brief", hint: "Your personalized digest", needsArg: false },
    { cmd: "research", label: "⚡ Research", hint: "Deep multi-source research on a topic", needsArg: true },
    { cmd: "visualize", label: "🗺️ Visualize", hint: "Turn a concept into a diagram", needsArg: true },
    { cmd: "translate", label: "🇲🇲 Translate", hint: "English ⇄ Myanmar translation", needsArg: true },
    { cmd: "memory", label: "🧠 Memory", hint: "Save something for TSO to remember", needsArg: true },
    { cmd: "memories", label: "🧠 Show memories", hint: "List everything you've saved", needsArg: false },
    { cmd: "projects", label: "📁 Projects", hint: "List your projects", needsArg: false },
    { cmd: "project", label: "📁 New project", hint: "name | description", needsArg: true },
    { cmd: "calc", label: "🧮 Calculator", hint: "e.g. /calc (25*4)+sqrt(81)", needsArg: true },
    { cmd: "convert", label: "📏 Unit converter", hint: "e.g. /convert 10 km mi", needsArg: true },
    { cmd: "jobs", label: "💼 Match jobs to my profile", hint: "e.g. /jobs graphic design, video editing", needsArg: true },
  ];
  const [showSlashMenu, setShowSlashMenu] = useState(false);
  const [slashFilter, setSlashFilter] = useState("");

  function auth() {
    return { token: user ? user.token : undefined, adminUsername: isAdmin ? adminUsername : undefined, adminPassword: isAdmin ? adminPassword : undefined };
  }

  function pushTsoMessage(payload) {
    setMessages((prev) => [...prev, { role: "tso", ...payload }]);
  }

  // Parses "/cmd rest of text" -> {cmd, arg} or null if not a slash command.
  function parseSlashCommand(raw) {
    const m = /^\/(\S+)\s*([\s\S]*)$/.exec(raw.trim());
    if (!m) return null;
    return { cmd: m[1].toLowerCase(), arg: m[2].trim() };
  }

  async function runSlashCommand(cmd, arg) {
    if (!turboActive && engine !== "turbo" && ["brief", "research", "visualize", "translate", "memory", "memories", "projects", "project"].includes(cmd)) {
      // These are Turbo V2 features — same gate the old icon row had.
      setShowTurboModal(true);
      return;
    }
    setSending(true); setError("");
    try {
      if (cmd === "brief") {
        const qs = new URLSearchParams();
        Object.entries(auth()).forEach(([k, v]) => v && qs.set(k, v));
        const r = await api("/turbo/brief?" + qs);
        if (r.ok) pushTsoMessage({ text: r.summary, brief: r });
        else setError(r.error || "Could not load your Daily Brief.");
      } else if (cmd === "research") {
        if (!arg) { setError("Tell me what to research, e.g. /research remote UX design jobs"); return; }
        const r = await api("/turbo/research", { method: "POST", body: JSON.stringify({ ...auth(), query: arg }) });
        if (r.ok) pushTsoMessage({ text: r.reply, sources: r.sources, source: "turbo_research" });
        else setError(r.error || "Research failed.");
      } else if (cmd === "visualize") {
        if (!arg) { setError("Tell me what to visualize, e.g. /visualize how photosynthesis works"); return; }
        const r = await api("/turbo/visualize", { method: "POST", body: JSON.stringify({ ...auth(), query: arg }) });
        if (r.ok) pushTsoMessage({ text: `Here's a diagram for "${arg}":`, diagram: r.diagram });
        else setError(r.error || "Could not build that diagram.");
      } else if (cmd === "translate") {
        if (!arg) { setError("Give me some text to translate, e.g. /translate Thank you for your help"); return; }
        const r = await api("/turbo/translate", { method: "POST", body: JSON.stringify({ ...auth(), text: arg, formality: "polite" }) });
        if (r.ok) pushTsoMessage({ text: r.translation, translation: r });
        else setError(r.error || "Could not translate that.");
      } else if (cmd === "memory") {
        if (!arg) { setError("Tell me what to remember, e.g. /memory I prefer concise explanations."); return; }
        const r = await api("/turbo/memory", { method: "POST", body: JSON.stringify({ ...auth(), memory: arg }) });
        if (r.ok) pushTsoMessage({ text: "Got it, I'll remember that." });
        else setError(r.error || "Could not save memory.");
      } else if (cmd === "memories") {
        const qs = new URLSearchParams();
        Object.entries(auth()).forEach(([k, v]) => v && qs.set(k, v));
        const r = await api("/turbo/memory?" + qs);
        if (r.ok) {
          const list = r.memories || [];
          pushTsoMessage({ text: list.length ? "Here's what I've saved for you:" : "You haven't saved anything to memory yet — try /memory <something to remember>.", memories: list });
        } else setError(r.error || "Could not load memory.");
      } else if (cmd === "projects") {
        const qs = new URLSearchParams();
        Object.entries(auth()).forEach(([k, v]) => v && qs.set(k, v));
        const r = await api("/turbo/projects?" + qs);
        if (r.ok) {
          const list = r.projects || [];
          pushTsoMessage({ text: list.length ? "Your projects:" : "No projects yet — try /project Study Plan | SAT prep tracking", projects: list });
        } else setError(r.error || "Could not load projects.");
      } else if (cmd === "project") {
        const [name, ...rest] = arg.split("|");
        if (!name || !name.trim()) { setError("Format: /project Name | Description"); return; }
        const r = await api("/turbo/projects", { method: "POST", body: JSON.stringify({ ...auth(), name: name.trim(), description: rest.join("|").trim() }) });
        if (r.ok) pushTsoMessage({ text: `Created project "${name.trim()}".` });
        else setError(r.error || "Could not create project.");
      } else if (cmd === "calc" || cmd === "convert") {
        if (!arg) { setError(cmd === "calc" ? "Give me an expression, e.g. /calc (25*4)+sqrt(81)" : "Format: /convert value from to, e.g. /convert 10 km mi"); return; }
        let body = { ...auth(), action: cmd === "calc" ? "calculate" : "convert" };
        if (cmd === "calc") body.expression = arg;
        else { const [v, a, b] = arg.split(/\s+/); body.value = v; body.from = a; body.to = b; }
        const r = await api("/turbo/tools", { method: "POST", body: JSON.stringify(body) });
        if (r.ok) pushTsoMessage({ text: JSON.stringify(r.result ?? r.results, null, 2), isCode: true });
        else setError(r.error || "Tool failed.");
      } else if (cmd === "jobs") {
        if (!arg) { setError("Tell me a bit about your profile/skills to match against, e.g. /jobs graphic design and video editing"); return; }
        const r = await api("/turbo/tools", { method: "POST", body: JSON.stringify({ ...auth(), action: "job_match", profile: arg }) });
        if (r.ok) pushTsoMessage({ text: JSON.stringify(r.results, null, 2), isCode: true });
        else setError(r.error || "Could not match jobs right now.");
      } else {
        setError(`Unknown command "/${cmd}". Type "/" to see available commands.`);
      }
    } finally {
      setSending(false);
    }
  }

  async function handleFiles(fileList) {
    setAttachError("");
    const files = Array.from(fileList || []);
    if (!files.length) return;
    if (pendingAttachments.length + files.length > 4) {
      setAttachError("You can attach up to 4 files at once.");
      return;
    }
    try {
      const read = await Promise.all(files.map((f) => {
        if (f.size > 8 * 1024 * 1024) throw new Error(`"${f.name}" is over 8MB — please pick a smaller file.`);
        return readFileAsAttachment(f);
      }));
      setPendingAttachments((prev) => [...prev, ...read]);
    } catch (e) {
      setAttachError(e.message || "Couldn't read that file.");
    }
  }

  function removeAttachment(idx) {
    setPendingAttachments((prev) => prev.filter((_, i) => i !== idx));
  }

  async function send() {
    const text = input.trim();
    if ((!text && pendingAttachments.length === 0) || sending) return;

    const slash = !imageMode && pendingAttachments.length === 0 ? parseSlashCommand(text) : null;
    if (slash) {
      setMessages((prev) => [...prev, { role: "user", text }]);
      setInput(""); setShowSlashMenu(false);
      await runSlashCommand(slash.cmd, slash.arg);
      return;
    }

    if (imageMode) {
      // Image-generation mode: the search box text is the image prompt.
      // Note: our self-hosted generator works from text only (no reference-
      // image editing), so any attached files aren't sent along here.
      if (!text) { setAttachError("Describe the image you'd like TSO to create."); return; }
      setMessages((prev) => [...prev, { role: "user", text }]);
      setInput(""); setPendingAttachments([]); setSending(true); setError("");
      const stepsByQuality = { fast: 15, balanced: 25, detailed: 40 };
      const res = await api("/ai/generate-image", {
        method: "POST",
        body: JSON.stringify({
          prompt: text,
          enhance: imageEnhance,
          negativePrompt: imageNegativePrompt.trim() || undefined,
          aspectRatio: imageAspectRatio,
          steps: stepsByQuality[imageQuality] || undefined,
        }),
      });
      setSending(false);
      if (res.ok) {
        const caption = res.seconds ? `Here's what I created (${res.seconds}s):` : "Here's what I created:";
        setMessages((prev) => [...prev, {
          role: "tso", text: caption, images: res.images,
          enhancedPrompt: imageEnhance ? res.enhancedPrompt : null,
        }]);
      } else {
        setError(res.error || "TSO couldn't generate that image just now.");
      }
      return;
    }

    if (engine === "turbo" && !turboActive) {
      setShowTurboModal(true);
      return;
    }

    const history = messages.slice(-8).filter((m) => !m.images).map((m) => ({ role: m.role, text: m.text }));
    const attachmentsForRequest = pendingAttachments.map((a) => ({ name: a.name, mimeType: a.mimeType, data: a.data }));
    const activeResearchMode = engine === "turbo" ? researchMode : null;
    setMessages((prev) => [...prev, { role: "user", text, attachments: pendingAttachments, researchMode: activeResearchMode }]);
    setInput(""); setPendingAttachments([]); setSending(true); setError("");
    setResearchMode(null); // one-shot per message — pick again for the next question
    const res = await api("/ai/chat", {
      method: "POST",
      body: JSON.stringify({
        message: text, history, attachments: attachmentsForRequest, engine,
        researchMode: activeResearchMode || undefined,
        token: user ? user.token : undefined,
        adminUsername: isAdmin ? adminUsername : undefined, adminPassword: isAdmin ? adminPassword : undefined,
      }),
    });
    setSending(false);
    if (res.ok) {
      setMessages((prev) => [...prev, { role: "tso", text: res.reply, engine: res.engine, responseMs: res.responseMs, source: res.source }]);
    } else if (res.requiresTurbo) {
      setEngine("neo");
      setShowTurboModal(true);
      setError(res.error || "Turbo requires an active subscription.");
    } else {
      setError(res.error || "TSO couldn't respond just now.");
    }
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  }

  return (
    <div className="min-h-screen flex flex-col" style={{ background: "#faf9fd" }}>
      <input ref={fileInputRef} type="file" multiple accept="image/*,video/*,.pdf,.doc,.docx,.txt,.csv" className="hidden"
        onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }} />

      <header className="sticky top-0 z-40 relative overflow-hidden" style={{ background: "linear-gradient(115deg, #100c34 0%, #211a6b 38%, #5b21b6 72%, #8b19a8 100%)" }}>
        <div aria-hidden="true" className="absolute -top-10 right-10 w-40 h-40 rounded-full opacity-40 blur-3xl" style={{ background: "radial-gradient(circle, #c026d3 0%, transparent 70%)" }} />
        <div className="relative max-w-3xl mx-auto px-4 sm:px-5 py-4 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            <TSOAIMascot expression="happy" size={40} />
            <div className="leading-tight">
              <div className="font-extrabold text-[18px] tracking-tight text-white">TSO <span style={{ color: "#e9b8ff" }}>AI</span></div>
              <div className="text-[10px] font-bold tracking-wider text-violet-200/80 uppercase">{isAdmin ? "Creator assistant" : "Talentshowoff assistant"}</div>
            </div>
          </div>
          <div className="flex items-center gap-2">
            {(user || isAdmin) && (
              <button type="button" onClick={() => setShowHistory(true)}
                className="w-9 h-9 rounded-xl flex items-center justify-center text-white/90 hover:bg-white/10 transition" title="Chat history">
                <Icon path={ICONS.history} size={18} />
              </button>
            )}
            <button type="button" onClick={() => window.close()} className="px-3.5 py-2 rounded-xl text-sm font-bold text-white/90 hover:bg-white/10 transition">Close</button>
          </div>
        </div>
        <div className="relative max-w-3xl mx-auto px-4 sm:px-5 pb-3 flex items-center gap-2">
          <button type="button" onClick={() => selectEngine("neo")}
            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold border transition ${engine === "neo" ? "bg-white text-violet-700 border-white" : "text-white/80 border-white/25 hover:bg-white/10"}`}>

          <div className="relative ml-auto">

                </button>

      <main className="flex-1 flex flex-col max-w-3xl w-full mx-auto px-3 sm:px-5">

            <div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
              <div className={`rounded-2xl px-4 py-3 text-sm ${m.role === "tso" && (/\|.*\|/.test(m.text || "") || (m.text || "").length > 220 || m.diagram || m.sources || m.memories || m.projects || m.brief) ? "max-w-[95%]" : "max-w-[85%]"} ${m.role === "user" ? "text-white whitespace-pre-line" : "bg-white border border-slate-200 text-slate-700 shadow-sm"}`}

                    {m.translation.explanation && <div><div className="text-[10px] font-extrabold uppercase text-slate-400 mb-0.5">Why this phrasing</div><div className="text-xs text-slate-500">{m.translation.explanation}</div></div>}

          {error && <p className="text-xs text-red-600 font-semibold">{error}</p>}

        <div className="sticky bottom-0 pb-4 sm:pb-6 pt-2 bg-gradient-to-t from-[#faf9fd] via-[#faf9fd] to-transparent">
          {imageMode && (
            <div className="mb-2 space-y-2">
              <div className="flex items-center gap-2 flex-wrap">
                <div className="flex items-center gap-2 text-xs font-bold text-violet-700 bg-violet-50 border border-violet-100 rounded-full px-3 py-1.5">
                  <Icon path={ICONS.wand} size={13} />

                  <button type="button" onClick={() => setImageMode(false)} className="ml-1 text-violet-400 hover:text-violet-700"><Icon path={ICONS.close} size={12} /></button>
                </div>
                <button type="button" onClick={() => setImageOptionsOpen((o) => !o)}
                  className={`flex items-center gap-1.5 text-xs font-bold rounded-full px-3 py-1.5 border transition ${imageOptionsOpen ? "text-violet-700 bg-violet-50 border-violet-100" : "text-slate-500 bg-white border-slate-200 hover:bg-slate-50"}`}>
                  <Icon path={ICONS.sliders} size={13} />
                  Precision options
                </button>
              </div>
              {imageOptionsOpen && (
                <div className="bg-white border border-slate-200 rounded-2xl p-3 space-y-3 text-xs">
                  <label className="flex items-start gap-2 cursor-pointer">
                    <input type="checkbox" checked={imageEnhance} onChange={(e) => setImageEnhance(e.target.checked)} className="mt-0.5" />
                    <span>
                      <span className="font-bold text-slate-700 block">Let TSO sharpen my prompt</span>
                      <span className="text-slate-400">Expands short requests with detail, composition, and lighting so the image matches your command more closely. Turn off if you already write detailed prompts.</span>
                    </span>
                  </label>

                  <div>
                    <span className="font-bold text-slate-700 block mb-1.5">Shape</span>
                    <div className="flex gap-1.5">
                      {[["square", "Square"], ["landscape", "Landscape"], ["portrait", "Portrait"]].map(([val, label]) => (
                        <button key={val} type="button" onClick={() => setImageAspectRatio(val)}
                          className={`px-2.5 py-1 rounded-lg font-semibold border text-[11px] ${imageAspectRatio === val ? "bg-violet-600 text-white border-violet-600" : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50"}`}>
                          {label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <span className="font-bold text-slate-700 block mb-1.5">Detail level</span>
                    <div className="flex gap-1.5">
                      {[["fast", "Fast"], ["balanced", "Balanced"], ["detailed", "Detailed"]].map(([val, label]) => (
                        <button key={val} type="button" onClick={() => setImageQuality(val)}
                          className={`px-2.5 py-1 rounded-lg font-semibold border text-[11px] ${imageQuality === val ? "bg-violet-600 text-white border-violet-600" : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50"}`}>
                          {label}
                        </button>
                      ))}
                    </div>
                    <p className="text-slate-400 mt-1">Detailed takes longer but follows your command more closely.</p>
                  </div>

                  <div>
                    <span className="font-bold text-slate-700 block mb-1.5">Avoid in the image (optional)</span>
                    <input type="text" value={imageNegativePrompt} onChange={(e) => setImageNegativePrompt(e.target.value)}
                      placeholder="e.g. text, watermark, extra people"
                      className="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-[11px] outline-none focus:border-violet-400" />
                    <p className="text-slate-400 mt-1">TSO already avoids common glitches (bad hands, blur, watermarks) by default — add anything else you want kept out.</p>
                  </div>
                </div>
              )}
            </div>
          )}
          {!imageMode && pendingAttachments.length > 0 && (
            <div className="flex flex-wrap gap-2 mb-2">
              {pendingAttachments.map((a, i) => <TSOAIAttachmentChip key={i} att={a} onRemove={() => removeAttachment(i)} />)}
            </div>
          )}
          {attachError && <p className="text-xs text-red-600 font-semibold mb-1.5">{attachError}</p>}
          {engine === "turbo" && turboActive && !imageMode && !showSlashMenu && (
            <button type="button" onClick={() => { setInput("/"); setShowSlashMenu(true); setSlashFilter(""); }}
              className="mb-2 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-violet-50 border border-violet-100 text-[11px] font-bold text-violet-700 hover:bg-violet-100 transition">
              <Icon path={ICONS.bolt} size={12} />
              Type "/" for Daily Brief, Research, Visualize, Translate, Memory, Projects & Tools
            </button>
          )}

          <div className="relative bg-white border border-slate-200 rounded-2xl shadow-lg flex items-end gap-2 p-2.5">
            {showSlashMenu && (
              <React.Fragment>
                <div className="fixed inset-0 z-10" onClick={() => setShowSlashMenu(false)} />
                <div className="absolute bottom-full mb-2 left-0 right-0 z-20 bg-white border border-slate-200 rounded-2xl shadow-xl py-1.5 max-h-72 overflow-y-auto">
                  {SLASH_COMMANDS.filter((c) => c.cmd.startsWith(slashFilter.toLowerCase())).length === 0 && (
                    <div className="px-3.5 py-3 text-xs text-slate-400">No matching command.</div>
                  )}
                  {SLASH_COMMANDS.filter((c) => c.cmd.startsWith(slashFilter.toLowerCase())).map((c) => (
                    <button key={c.cmd} type="button"
                      onClick={() => { setInput(`/${c.cmd}${c.needsArg ? " " : ""}`); setShowSlashMenu(!c.needsArg ? false : true); setSlashFilter(c.cmd); }}
                      className="w-full flex items-center justify-between gap-3 px-3.5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-violet-50 text-left">
                      <span>{c.label} <span className="text-slate-400 font-normal">/{c.cmd}</span></span>
                      <span className="text-[11px] text-slate-400 font-normal shrink-0">{c.hint}</span>
                    </button>
                  ))}
                </div>
              </React.Fragment>
            )}
            <div className="relative shrink-0">
              <button type="button" onClick={() => setPlusOpen((o) => !o)}
                className="w-10 h-10 rounded-xl flex items-center justify-center text-violet-600 hover:bg-violet-50 transition">
                <Icon path={ICONS.plus} size={20} />
              </button>
              {plusOpen && (
                <React.Fragment>
                  <div className="fixed inset-0 z-10" onClick={() => setPlusOpen(false)} />
                  <div className="absolute bottom-12 left-0 z-20 bg-white border border-slate-200 rounded-xl shadow-xl py-1.5 w-56">
                    {!imageMode && (
                      <button type="button" onClick={() => { fileInputRef.current && fileInputRef.current.click(); setPlusOpen(false); }}
                        className="w-full flex items-center gap-2.5 px-3.5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">
                        <Icon path={ICONS.paperclip} size={16} className="text-slate-500" />
                        Upload photo, video, or file
                      </button>
                    )}
                    {imageMode ? (
                      <button type="button" onClick={() => { setImageMode(false); setPlusOpen(false); }}
                        className="w-full flex items-center gap-2.5 px-3.5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">
                        <Icon path={ICONS.close} size={16} className="text-slate-500" />
                        Exit image generation
                      </button>
                    ) : (
                      <button type="button" onClick={() => { setImageMode(true); setPendingAttachments([]); setPlusOpen(false); }}
                        className="w-full flex items-center gap-2.5 px-3.5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">
                        <Icon path={ICONS.wand} size={16} className="text-violet-600" />
                        Create an image
                      </button>
                    )}
                  </div>
                </React.Fragment>
              )}
            </div>

            <textarea value={input}
              onChange={(e) => {
                const v = e.target.value;
                setInput(v);
                const m = /^\/(\S*)$/.exec(v);
                if (m) { setShowSlashMenu(true); setSlashFilter(m[1]); }
                else if (!v.startsWith("/")) setShowSlashMenu(false);
              }}
              onKeyDown={(e) => { if (e.key === "Escape") setShowSlashMenu(false); handleKeyDown(e); }}
              rows={1}
              placeholder={imageMode ? "Describe the image you want TSO to create…" : (engine === "turbo" && turboActive ? "Message TSO AI, or type / for tools…" : "Message TSO AI…")}
              className="flex-1 resize-none outline-none text-sm py-2.5 max-h-32 bg-transparent" />

            <Button type="button" onClick={send} disabled={sending || (!input.trim() && pendingAttachments.length === 0)} className="shrink-0 !px-4 !py-2.5">
              <Icon path={ICONS.send} size={16} />
            </Button>
          </div>
          <p className="text-center text-[11px] text-slate-400 mt-2">TSO AI can make mistakes. Check important information.</p>
        </div>
      </main>
      {showTurboModal && (
        <TurboSubscribeModal
          user={user}
          onClose={() => setShowTurboModal(false)}
          onSubscribed={handleTurboSubscribed}
        />
      )}
      {showHistory && (
        <TSOHistoryPanel
          user={user} isAdmin={isAdmin} adminUsername={adminUsername} adminPassword={adminPassword}
          onClose={() => setShowHistory(false)}
          onRestore={(historyMessages) => {
            setMessages(historyMessages.map(m => ({ role: m.role, text: m.text, engine: m.engine })));
          }}
        />
      )}
    </div>
  );
}

function TSOChat({ isAdmin, adminUsername, adminPassword, openSignal }) {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState(() => [
    { role: "tso", text: "Hi, I'm TSO! Ask me about job listings, how to apply, or how to sign up." }
  ]);
  const [input, setInput] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");
  const [expression, setExpression] = useState("greeting");
  const [avatar3DFailed, setAvatar3DFailed] = useState(false);
  const [welcoming, setWelcoming] = useState(false);
  const [showWelcomeBubble, setShowWelcomeBubble] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (openSignal) setOpen(true);
  }, [openSignal]);

  // Automatic welcome: shortly after the widget appears, TSO waves and shows
  // a greeting bubble on its own — no click required.
  useEffect(() => {
    const showTimer = setTimeout(() => {
      setExpression("greeting");
      setWelcoming(true);
      setShowWelcomeBubble(true);
    }, 900);
    const settleTimer = setTimeout(() => setWelcoming(false), 2200);
    const hideTimer = setTimeout(() => setShowWelcomeBubble(false), 6500);
    return () => { clearTimeout(showTimer); clearTimeout(settleTimer); clearTimeout(hideTimer); };
  }, []);

  useEffect(() => {
    if (open && scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, open, sending]);

  useEffect(() => {
    setMessages((prev) => {
      if (prev.length > 1) return prev; // don't reset an in-progress conversation
      return [{
        role: "tso",
        text: isAdmin
          ? "Hi, I'm TSO! I can help draft a post, give you a read on an applicant, or answer questions about your recent activity."
          : "Hi, I'm TSO! Ask me about job listings, how to apply, or how to sign up.",
      }];
    });
  }, [isAdmin]);

  async function send() {
    const text = input.trim();
    if (!text || sending) return;
    const history = messages.slice(-8).map((m) => ({ role: m.role, text: m.text }));
    setMessages((prev) => [...prev, { role: "user", text }]);
    setInput(""); setSending(true); setError("");
    setExpression("thinking");
    const res = await api("/ai/chat", {
      method: "POST",
      body: JSON.stringify({ message: text, history, adminUsername: isAdmin ? adminUsername : undefined, adminPassword: isAdmin ? adminPassword : undefined }),
    });
    setSending(false);
    if (res.ok) {
      setMessages((prev) => [...prev, { role: "tso", text: res.reply }]);
      setExpression("happy");
    } else {
      setError(res.error || "TSO couldn't respond just now.");
      setExpression("sad");
    }
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  }

  return (
    <React.Fragment>
      <div className="fixed bottom-4 right-4 z-40 flex flex-col items-end gap-1">
        {!open && (
          <div className={`rounded-2xl bg-white border border-violet-100 shadow-lg px-3 py-2 text-xs font-bold text-slate-700 mb-1 ${showWelcomeBubble ? "animate-floatIn" : ""}`}>
            {showWelcomeBubble ? (isAdmin ? "👋 Welcome back! Need a hand?" : "👋 Hi! I'm TSO — ask me anything.") : "Ask TSO AI"}
          </div>
        )}
        {avatar3DFailed
          ? <TSOAIMascot expression={open ? expression : (welcoming ? "greeting" : "happy")} size={78} onClick={() => { setOpen((o) => !o); setExpression("greeting"); setShowWelcomeBubble(false); }} />
          : <TSOAvatar3D size={64} welcoming={welcoming} talking={sending} expression={!open ? "smile" : ""} onClick={() => { setOpen((o) => !o); setExpression("greeting"); setShowWelcomeBubble(false); }} onLoadError={() => setAvatar3DFailed(true)} />}
      </div>
      {open && (
        <div className="fixed bottom-20 right-5 z-40 w-[92vw] max-w-sm h-[70vh] max-h-[560px] bg-white rounded-2xl border border-slate-200 shadow-2xl flex flex-col overflow-hidden">
          <div className="px-4 py-3 text-white flex items-center gap-2" style={{ background: "linear-gradient(135deg, #1e1b6e 0%, #7c3aed 100%)" }}>
            <TSOAIMascot expression={expression} size={34} onClick={() => setExpression("happy")} className="shrink-0" />
            <div>
              <p className="font-extrabold text-sm leading-tight">TSO</p>
              <p className="text-xs text-white/80 leading-tight">{isAdmin ? "Creator assistant" : "Talentshowoff assistant"}</p>
            </div>
          </div>
          <div ref={scrollRef} className="flex-1 overflow-y-auto px-4 py-3 space-y-3">
            <div className="flex items-center justify-center py-1">
              {avatar3DFailed
                ? <TSOAIMascot expression={expression} size={96} onClick={() => setExpression(expression === "happy" ? "wink" : "happy")} />
                : <TSOAvatar3D size={110} welcoming={welcoming} talking={sending} expression={expression === "happy" ? "happy" : expression === "wink" ? "wink" : expression === "greeting" ? "smile" : ""} onClick={() => setExpression(expression === "happy" ? "wink" : "happy")} onLoadError={() => setAvatar3DFailed(true)} />}
            </div>
            {messages.map((m, i) => (
              <div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
                <div className={`rounded-2xl px-3 py-2 text-sm max-w-[85%] whitespace-pre-line ${m.role === "user" ? "text-white" : "bg-slate-100 text-slate-700"}`}
                  style={m.role === "user" ? { background: "linear-gradient(135deg, #1e1b6e 0%, #7c3aed 100%)" } : {}}>
                  {m.text}
                </div>
              </div>
            ))}
            {sending && <div className="flex justify-start"><div className="rounded-2xl px-3 py-2 text-sm bg-slate-100 text-slate-400">TSO is typing…</div></div>}
            {error && <p className="text-xs text-red-600 font-semibold">{error}</p>}
          </div>
          <div className="border-t border-slate-100 p-3 flex items-end gap-2">
            <textarea value={input} onFocus={() => setExpression("greeting")} onChange={(e) => { setInput(e.target.value); setExpression(e.target.value.trim() ? "thinking" : "greeting"); }} onKeyDown={handleKeyDown} rows={1}
              placeholder="Message TSO…" className="flex-1 resize-none rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-violet-400 max-h-24" />
            <Button type="button" onClick={send} disabled={sending || !input.trim()}>Send</Button>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function Footer() {
  return (
    <footer className="border-t border-slate-200 mt-8">
      <div className="max-w-6xl mx-auto px-5 py-8 flex flex-col sm:flex-row items-center justify-between gap-3">
        <div className="flex items-center gap-2"><TSOMark size={22} /><span className="text-sm font-bold text-slate-700">Talentshowoff</span></div>
        <div className="flex items-center gap-4 text-xs font-semibold">
          <button onClick={() => window.dispatchEvent(new CustomEvent("tso:navigate", { detail: "terms" }))} className="text-slate-500 hover:text-violet-700">Terms of Service</button>
          <button onClick={() => window.dispatchEvent(new CustomEvent("tso:navigate", { detail: "privacy" }))} className="text-slate-500 hover:text-violet-700">Privacy Policy</button>
        </div>
      </div>
      <div className="text-center text-xs text-slate-400 pb-6">© 2026 Talentshowoff. All rights reserved.</div>
    </footer>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
