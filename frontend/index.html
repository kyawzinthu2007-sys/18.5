                <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className="h-full w-[18%] bg-blue-500 rounded-full" /></div>
                <div className="text-[11px] text-slate-400 mt-1">Mailbox storage</div>
              </div>
            </aside>

            <div className="flex-1 min-w-0">
              {composing ? (
                <ComposeMail user={user} mailbox={mailbox} onSent={() => { setComposing(false); setActiveFolder("Sent"); loadFolders(); loadMessages("Sent"); }} onCancel={() => setComposing(false)} />
              ) : selected ? (
                <div className="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_260px] min-h-[680px]">
                  <MessageView message={selected} onBack={() => setSelected(null)} onMove={moveMessage} onReply={() => setComposing(true)} activeFolder={activeFolder} onToggleLabel={toggleLabel} user={user} />
                  {showDetails && (
                    <aside className="hidden xl:block border-l border-slate-200 p-5 bg-white">
                      <div className="flex items-center justify-between mb-5">
                        <h3 className="text-sm font-bold text-slate-800">Email details</h3>
                        <button onClick={() => setShowDetails(false)} className="text-slate-400 hover:text-slate-700">×</button>
                      </div>
                      <div className="flex items-center gap-3 mb-5">
                        <div className="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">{(selected.fromName || selected.fromAddress || "?").charAt(0).toUpperCase()}</div>
                        <div className="min-w-0"><div className="font-bold text-sm truncate">{selected.fromName || selected.fromAddress}</div><div className="text-xs text-slate-400 truncate">{selected.fromAddress}</div></div>
                      </div>
                      <div className="space-y-4 text-xs">
                        <div><div className="text-slate-400 mb-1">From</div><div className="text-slate-700 break-all">{selected.fromAddress}</div></div>
                        <div><div className="text-slate-400 mb-1">To</div><div className="text-slate-700 break-all">{(selected.toAddresses || []).join(", ")}</div></div>
                        {selected.ccAddresses?.length > 0 && <div><div className="text-slate-400 mb-1">Cc</div><div className="text-slate-700 break-all">{selected.ccAddresses.join(", ")}</div></div>}
                        <div><div className="text-slate-400 mb-1">Date</div><div className="text-slate-700">{new Date(selected.sentAt || selected.createdAt).toLocaleString()}</div></div>
                        <div><div className="text-slate-400 mb-1">Subject</div><div className="text-slate-700">{selected.subject}</div></div>
                        <div><div className="text-slate-400 mb-1">Mailbox</div><div className="text-slate-700 break-all">{mailbox?.address}</div></div>
                      </div>
                      <div className="mt-6 pt-5 border-t border-slate-100">
                        <div className="text-xs font-bold text-slate-700 mb-2">Labels</div>
                        <div className="flex flex-wrap gap-1.5"><span className="px-2 py-1 rounded-full bg-blue-50 text-blue-700">Inbox</span><span className="px-2 py-1 rounded-full bg-amber-50 text-amber-700">{selected.isStarred ? "Starred" : "General"}</span></div>
                      </div>
                    </aside>
                  )}
                </div>
              ) : (
                <div>
                  <div className="px-3 sm:px-5 pt-3">
                    <div className="flex items-center justify-between border-b border-slate-100">
                      <div className="flex gap-5">
                        {["Primary", "Promotions", "Social"].map((tab, i) => (
                          <button key={tab} className={`px-2 py-3 text-sm font-bold border-b-2 ${i === 0 ? "text-blue-600 border-blue-600" : "text-slate-400 border-transparent"}`}>{tab}</button>
                        ))}
                      </div>
                      <div className="hidden sm:block text-xs text-slate-400">{visibleMessages.length} messages</div>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 px-3 sm:px-5 py-2.5 border-b border-slate-200 bg-white sticky top-0 z-10">
                    <input type="checkbox" checked={visibleMessages.length > 0 && checked.length === visibleMessages.length}
                      onChange={e => setChecked(e.target.checked ? visibleMessages.map(m => m.id) : [])} className="w-4 h-4 accent-blue-600" />
                    <button onClick={() => loadMessages(activeFolder)} className="p-2 rounded-lg hover:bg-slate-100 text-slate-500" title="Refresh">↻</button>
                    {checked.length > 0 ? (
                      <>
                        <button onClick={() => bulkMove("Trash")} className="p-2 rounded-lg hover:bg-red-50 text-slate-500" title="Delete">⌫</button>
                        <button onClick={() => bulkMove(activeFolder === "Spam" ? "Inbox" : "Spam")} className="p-2 rounded-lg hover:bg-slate-100 text-slate-500" title="Move">›</button>
                        <span className="text-xs font-semibold text-slate-400">{checked.length} selected</span>
                      </>
                    ) : <span className="text-xs text-slate-400 ml-1">{unreadCount} unread</span>}
                  </div>

                  <div className="divide-y divide-slate-100">
                    {loadingMessages ? (
                      <div className="text-center py-20"><div className="w-8 h-8 rounded-full border-2 mx-auto animate-spin" style={{ borderColor:"#dbeafe", borderTopColor:"#2563eb" }} /><p className="text-sm text-slate-400 mt-3">Loading messages…</p></div>
                    ) : visibleMessages.length === 0 ? (
                      <div className="text-center py-20 px-6">
                        <div className="w-14 h-14 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center mx-auto mb-4 text-2xl">✉</div>
                        <p className="font-bold text-slate-700">{search ? "No matching mail" : `No messages in ${folderDisplayName(activeFolder)}.`}</p>
                        <p className="text-sm text-slate-400 mt-1">{search ? "Try a different sender, subject, or keyword." : "Your mailbox is ready for new messages."}</p>
                      </div>
                    ) : visibleMessages.map(m => (
                      <div key={m.id} className={`flex items-center gap-2 sm:gap-3 px-3 sm:px-5 py-3 hover:bg-blue-50/40 transition group ${!m.isRead ? "bg-blue-50/35" : ""}`}>
                        <input type="checkbox" checked={checked.includes(m.id)} onChange={e => setChecked(v => e.target.checked ? [...v, m.id] : v.filter(id => id !== m.id))} className="w-4 h-4 accent-blue-600 shrink-0" onClick={e => e.stopPropagation()} />
                        <button type="button" onClick={(e) => toggleStar(m, e)} className={`text-lg w-5 shrink-0 ${m.isStarred ? "text-amber-400" : "text-slate-300 hover:text-slate-500"}`}>★</button>
                        <button type="button" onClick={() => openMessage(m.id)} className="min-w-0 flex-1 grid grid-cols-[minmax(110px,190px)_minmax(0,1fr)] gap-2 sm:gap-4 text-left items-center">
                          <div className={`truncate text-sm ${!m.isRead ? "font-extrabold text-slate-900" : "font-semibold text-slate-700"}`}>{m.fromName || m.fromAddress}</div>
                          <div className="min-w-0 truncate text-sm">
                            <span className={!m.isRead ? "font-bold text-slate-800" : "text-slate-600"}>{m.subject}</span>
                            <span className="text-slate-400"> — {m.preview}</span>
                          </div>
                        </button>
                        <span className="text-xs text-slate-400 shrink-0 hidden sm:block">{m.hasAttachments && <span className="mr-1" title="Has attachment">📎</span>}{new Date(m.sentAt || m.createdAt).toLocaleDateString()}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function MessageView({ message, onBack, onMove, onReply, activeFolder, onToggleLabel, user }) {
  const [labels, setLabels] = useState(message.labels || []);
  const MAIL_LABEL_OPTIONS = [["Work", "🔵"], ["Personal", "🟢"], ["Projects", "🟠"]];
  async function handleToggleLabel(name) {
    const res = await onToggleLabel(message.id, name);
    if (res && res.ok) setLabels(res.labels);
  }
  function attachmentUrl(att) {
    return `${API}/mail/attachments/${att.id}/download?token=${encodeURIComponent(user.token)}`;
  }
  function fmtSize(bytes) {
    if (bytes >= 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    return `${Math.max(1, Math.round(bytes / 1024))} KB`;
  }
  return (
    <div className="bg-white min-w-0">
      <div className="h-14 border-b border-slate-200 flex items-center gap-1 px-3 sm:px-5">
        <button onClick={onBack} className="p-2 rounded-lg hover:bg-slate-100 text-slate-500" title="Back">←</button>
        <button className="p-2 rounded-lg hover:bg-slate-100 text-slate-500" title="Archive">▱</button>

    </div>
  );
}

function ComposeMail({ user, mailbox, onSent, onCancel }) {
  const [to, setTo] = useState("");
  const [cc, setCc] = useState("");
  const [subject, setSubject] = useState("");
  const [body, setBody] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");
  const [showCc, setShowCc] = useState(false);
  const [attachments, setAttachments] = useState([]); // [{tempId, name, sizeBytes, status: 'uploading'|'done'|'error', id?, error?}]
  const bodyRef = useRef(null);
  const fileInputRef = useRef(null);

  function wrapSelection(tagOpen, tagClose) {
    const ta = bodyRef.current;
    if (!ta) return;
    const start = ta.selectionStart, end = ta.selectionEnd;
    const selected = body.slice(start, end) || (tagOpen === "<b>" ? "bold text" : "italic text");
    const next = body.slice(0, start) + tagOpen + selected + tagClose + body.slice(end);
    setBody(next);
    requestAnimationFrame(() => { ta.focus(); ta.selectionStart = start + tagOpen.length; ta.selectionEnd = start + tagOpen.length + selected.length; });
  }

  async function uploadOneFile(file, existingTempId) {
    const tempId = existingTempId || ("tmp_" + Math.random().toString(36).slice(2));
    if (existingTempId) {
      setAttachments((prev) => prev.map((a) => a.tempId === tempId ? { ...a, status: "uploading", error: undefined } : a));
    } else {
      setAttachments((prev) => [...prev, { tempId, name: file.name, sizeBytes: file.size, status: "uploading", file }]);
    }
    try {
      const form = new FormData();
      form.append("file", file);
      const res = await fetch(API + "/mail/attachments", {
        method: "POST", headers: { Authorization: `Bearer ${user.token}` }, body: form,
      });
      const json = await res.json().catch(() => null);
      if (!res.ok || !json || !json.ok) {
        const message = (json && json.error) || `Upload failed (${res.status}).`;
        setAttachments((prev) => prev.map((a) => a.tempId === tempId ? { ...a, status: "error", error: message, file } : a));
        return;
      }
      setAttachments((prev) => prev.map((a) => a.tempId === tempId ? { ...a, status: "done", id: json.attachment.id, error: undefined } : a));
    } catch (err) {
      setAttachments((prev) => prev.map((a) => a.tempId === tempId ? { ...a, status: "error", error: "Network error — check your connection and retry.", file } : a));
    }
  }

  function handleFilesPicked(e) {
    const files = Array.from(e.target.files || []);
    files.forEach((f) => uploadOneFile(f));
    e.target.value = "";
  }

  function retryAttachment(att) {
    if (att.file) uploadOneFile(att.file, att.tempId);
  }

  async function removeAttachment(att) {
    setAttachments((prev) => prev.filter((a) => a.tempId !== att.tempId));
    if (att.id) {
      await api(`/mail/attachments/${att.id}`, { method: "DELETE", headers: { Authorization: `Bearer ${user.token}` } });
    }
  }

  async function send(e) {
    e.preventDefault();
    setError("");
    if (attachments.some((a) => a.status === "uploading")) { setError("Please wait for attachments to finish uploading."); return; }
    setSending(true);
    const attachmentIds = attachments.filter((a) => a.status === "done").map((a) => a.id);
    const res = await api("/mail/send", {
      method: "POST", headers: { Authorization: `Bearer ${user.token}` },
      body: JSON.stringify({ action: "send", to, cc, subject, body: body.replace(/\n/g, "<br>"), attachmentIds }),
    });
    setSending(false);
    if (res.ok) onSent();
    else setError(res.error || "Could not send your message.");
  }

  return (
    <form onSubmit={send} className="max-w-3xl mx-auto p-3 sm:p-6">
      <div className="bg-white rounded-2xl border border-slate-200 shadow-lg overflow-hidden">
        <div className="h-12 px-4 bg-slate-800 text-white flex items-center justify-between">
          <div className="font-bold text-sm">New Message</div>
          <button type="button" onClick={onCancel} className="text-white/80 hover:text-white">×</button>
        </div>
        <div className="p-5">
          <div className="flex items-center border-b border-slate-200 py-2">
            <span className="w-12 text-sm text-slate-500">To</span>
            <input required value={to} onChange={e => setTo(e.target.value)} className="flex-1 outline-none text-sm text-slate-800" placeholder="Recipients" />
            <button type="button" onClick={() => setShowCc(!showCc)} className="text-xs text-slate-500">Cc</button>
          </div>
          {showCc && <div className="flex items-center border-b border-slate-200 py-2"><span className="w-12 text-sm text-slate-500">Cc</span><input value={cc} onChange={e => setCc(e.target.value)} className="flex-1 outline-none text-sm text-slate-800" placeholder="Cc recipients" /></div>}
          <div className="flex items-center border-b border-slate-200 py-2">
            <span className="w-12 text-sm text-slate-500">Subject</span>
            <input value={subject} onChange={e => setSubject(e.target.value)} className="flex-1 outline-none text-sm text-slate-800" />
          </div>
          <textarea ref={bodyRef} value={body} onChange={e => setBody(e.target.value)} rows={14} className="w-full py-4 outline-none resize-none text-[15px] text-slate-800" placeholder="Write your message…" />
          {attachments.length > 0 && (
            <div className="flex flex-wrap gap-2 mb-3">
              {attachments.map(a => (
                <span key={a.tempId} className={`inline-flex items-center gap-2 text-xs font-semibold rounded-full pl-3 pr-2 py-1.5 ${a.status === "error" ? "bg-red-50 text-red-600" : "bg-slate-100 text-slate-700"}`}>
                  {a.status === "uploading" ? "⏳" : a.status === "error" ? "⚠" : "📎"} {a.name}
                  {a.status === "done" && <span className="text-slate-400">({Math.max(1, Math.round(a.sizeBytes / 1024))} KB)</span>}
                  {a.status === "error" && (
                    <>
                      <span>{a.error || "failed"}</span>
                      {a.file && <button type="button" onClick={() => retryAttachment(a)} className="underline text-red-700">retry</button>}
                    </>
                  )}
                  <button type="button" onClick={() => removeAttachment(a)} className="text-slate-400 hover:text-slate-600">×</button>
                </span>
              ))}
            </div>
          )}
          {error && <div className="text-sm font-semibold text-red-600 mb-3">{error}</div>}
          <input ref={fileInputRef} type="file" multiple className="hidden" onChange={handleFilesPicked} />
          <div className="flex items-center justify-between pt-3 border-t border-slate-100">
            <div className="flex gap-1 text-slate-400">
              <button type="button" onClick={() => wrapSelection("<b>", "</b>")} className="p-2 hover:bg-slate-100 rounded" title="Bold">B</button>
              <button type="button" onClick={() => wrapSelection("<i>", "</i>")} className="p-2 hover:bg-slate-100 rounded italic" title="Italic">I</button>
              <button type="button" onClick={() => { const url = prompt("Link URL:"); if (url) wrapSelection(`<a href="${url}" target="_blank">`, "</a>"); }} className="p-2 hover:bg-slate-100 rounded" title="Insert link">⌕</button>
              <button type="button" onClick={() => fileInputRef.current?.click()} className="p-2 hover:bg-slate-100 rounded" title="Attach files">📎</button>
            </div>
            <button type="submit" disabled={sending} className="px-5 py-2.5 rounded-full bg-blue-600 text-white text-sm font-bold hover:bg-blue-700 disabled:opacity-50">{sending ? "Sending…" : "Send"} <span className="ml-1">➤</span></button>
          </div>
        </div>
      </div>
    </form>
  );
}

function SecuritySettings({ user }) {
  const [status, setStatus] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [message, setMessage] = useState("");
  const [setupStep, setSetupStep] = useState(null); // null | "choose" | "totp-qr" | "totp-confirm" | "email-enable"
  const [qrUrl, setQrUrl] = useState("");
  const [confirmCode, setConfirmCode] = useState("");
  const [backupCodes, setBackupCodes] = useState(null);
  const [disablePassword, setDisablePassword] = useState("");
  const [showDisable, setShowDisable] = useState(false);
  const [regenPassword, setRegenPassword] = useState("");
  const [showRegen, setShowRegen] = useState(false);
  const [sessions, setSessions] = useState(null);
  const [busy, setBusy] = useState(false);

  async function loadStatus() {
    setLoading(true);
    const res = await api(`/auth/2fa/status?token=${encodeURIComponent(user.token)}`);
    setLoading(false);
    if (res.ok) setStatus(res);
  }
  useEffect(() => { loadStatus(); }, []);

  async function startTotpSetup() {
    setError(""); setBusy(true);
    const res = await api("/auth/2fa/totp/setup", { method: "POST", body: JSON.stringify({ token: user.token }) });
    setBusy(false);
    if (res.ok) {
      setQrUrl(`${API}/auth/2fa/qr?token=${encodeURIComponent(user.token)}&_=${Date.now()}`);
      setSetupStep("totp-qr");
    } else setError(res.error || "Could not start setup.");
  }

  async function confirmTotp(e) {
    e.preventDefault();
    setError(""); setBusy(true);
    const res = await api("/auth/2fa/totp/confirm", { method: "POST", body: JSON.stringify({ token: user.token, code: confirmCode }) });
    setBusy(false);
    if (res.ok) { setBackupCodes(res.backupCodes); setSetupStep(null); setConfirmCode(""); loadStatus(); }
    else setError(res.error || "Incorrect code.");
  }

  async function enableEmail2fa() {
    setError(""); setBusy(true);
    const res = await api("/auth/2fa/email/enable", { method: "POST", body: JSON.stringify({ token: user.token }) });
    setBusy(false);
    if (res.ok) { setBackupCodes(res.backupCodes); setSetupStep(null); loadStatus(); }
    else setError(res.error || "Could not enable email 2FA.");
  }

  async function disable2fa(e) {
    e.preventDefault();
    setError(""); setBusy(true);
    const res = await api("/auth/2fa/disable", { method: "POST", body: JSON.stringify({ token: user.token, password: disablePassword }) });
    setBusy(false);
    if (res.ok) { setMessage("Two-factor authentication is now off."); setShowDisable(false); setDisablePassword(""); loadStatus(); }
    else setError(res.error || "Could not disable 2FA.");
  }

  async function regenerateBackupCodes(e) {
    e.preventDefault();
    setError(""); setBusy(true);
    const res = await api("/auth/2fa/backup-codes/regenerate", { method: "POST", body: JSON.stringify({ token: user.token, password: regenPassword }) });
    setBusy(false);
    if (res.ok) { setBackupCodes(res.backupCodes); setShowRegen(false); setRegenPassword(""); loadStatus(); }
    else setError(res.error || "Could not regenerate backup codes.");
  }

  async function loadSessions() {
    const res = await api(`/auth/sessions?token=${encodeURIComponent(user.token)}`);
    if (res.ok) setSessions(res.sessions);
  }

  async function revokeOthers() {
    setBusy(true);
    const res = await api("/auth/sessions/revoke-others", { method: "POST", body: JSON.stringify({ token: user.token }) });
    setBusy(false);
    if (res.ok) { setMessage(`Signed out ${res.revoked} other session${res.revoked === 1 ? "" : "s"}.`); loadSessions(); }
  }

  async function toggleLoginAlerts(enabled) {
    await api("/auth/login-alerts", { method: "POST", body: JSON.stringify({ token: user.token, enabled }) });
    loadStatus();
  }

  if (loading) return <div className="border-t border-slate-200 pt-5"><p className="text-sm text-slate-400">Loading security settings…</p></div>;

  return (
    <div className="border-t border-slate-200 pt-5 space-y-5">
      <div>
        <h2 className="font-bold text-slate-900 mb-1">Two-factor authentication</h2>
        <p className="text-xs text-slate-500 mb-4">Add a second step to sign-in so a password alone isn't enough to get into your account.</p>

        {error && <p className="text-sm text-red-600 font-semibold mb-3">{error}</p>}
        {message && <p className="text-sm text-emerald-600 font-semibold mb-3">{message}</p>}

        {backupCodes && (
          <div className="mb-4 rounded-xl bg-amber-50 border border-amber-200 p-4">
            <div className="text-sm font-bold text-amber-900 mb-1">Save your backup codes</div>
            <p className="text-xs text-amber-800 mb-3">Each code works once, for when you can't use your authenticator app or email. Store them somewhere safe — they won't be shown again.</p>
            <div className="grid grid-cols-2 gap-1.5 font-mono text-xs bg-white rounded-lg p-3 border border-amber-100">
              {backupCodes.map((c, i) => <div key={i}>{c}</div>)}
            </div>
            <Button type="button" variant="outline" className="mt-3" onClick={() => setBackupCodes(null)}>Done, I've saved them</Button>
          </div>
        )}

        {status && status.enabled && !backupCodes && (
          <div className="rounded-xl bg-emerald-50 border border-emerald-200 p-4">
            <div className="text-sm font-bold text-emerald-900">
              Two-factor authentication is on ({status.method === "email" ? "email code" : "authenticator app"})
            </div>
            <div className="text-xs text-emerald-700 mt-1">{status.backupCodesRemaining} backup code{status.backupCodesRemaining === 1 ? "" : "s"} remaining.</div>
            <div className="flex flex-wrap gap-2 mt-3">
              <Button type="button" variant="outline" onClick={() => setShowRegen(!showRegen)}>Regenerate backup codes</Button>
              <Button type="button" variant="outline" onClick={() => setShowDisable(!showDisable)}>Turn off</Button>
            </div>
            {showRegen && (
              <div className="mt-3 space-y-2">
                <TextField label="Confirm password" type="password" value={regenPassword} onChange={(e) => setRegenPassword(e.target.value)} />
                <Button type="button" onClick={regenerateBackupCodes} disabled={busy || !regenPassword}>{busy ? "Working…" : "Regenerate"}</Button>
              </div>
            )}
            {showDisable && (
              <div className="mt-3 space-y-2">
                <TextField label="Confirm password" type="password" value={disablePassword} onChange={(e) => setDisablePassword(e.target.value)} />
                <Button type="button" variant="outline" onClick={disable2fa} disabled={busy || !disablePassword}>{busy ? "Working…" : "Turn off 2FA"}</Button>
              </div>
            )}
          </div>
        )}

        {status && !status.enabled && !setupStep && !backupCodes && (
          <div className="flex flex-wrap gap-2">
            <Button type="button" variant="outline" onClick={startTotpSetup} disabled={busy}>Use an authenticator app</Button>
            <Button type="button" variant="outline" onClick={enableEmail2fa} disabled={busy || !user.email}>Use email codes</Button>
          </div>
        )}

        {setupStep === "totp-qr" && (
          <div className="rounded-xl bg-slate-50 border border-slate-200 p-4">
            <p className="text-sm text-slate-700 mb-3">Scan this with Google Authenticator, Authy, or any TOTP app, then enter the 6-digit code it shows.</p>
            {qrUrl && <img src={qrUrl} alt="2FA setup QR code" className="w-48 h-48 border border-slate-200 rounded-lg bg-white p-2 mx-auto" />}
            <div className="mt-4 space-y-2">
              <TextField label="6-digit code" required value={confirmCode} onChange={(e) => setConfirmCode(e.target.value.replace(/\D/g, ""))} placeholder="123456" autoFocus />
              <div className="flex gap-2">
                <Button type="button" onClick={confirmTotp} disabled={busy || confirmCode.length !== 6}>{busy ? "Verifying…" : "Turn on 2FA"}</Button>
                <Button type="button" variant="ghost" onClick={() => setSetupStep(null)}>Cancel</Button>
              </div>
            </div>
          </div>
        )}
      </div>

      <div className="border-t border-slate-200 pt-5">
        <h2 className="font-bold text-slate-900 mb-1">Login alerts</h2>
        <p className="text-xs text-slate-500 mb-3">Get an email whenever your account is signed in to.</p>
        <label className="flex items-center gap-2 text-sm font-semibold text-slate-700">
          <input type="checkbox" checked={status ? status.loginAlertsEnabled : true} onChange={(e) => toggleLoginAlerts(e.target.checked)} />
          Email me on new sign-ins
        </label>
      </div>

      <div className="border-t border-slate-200 pt-5">
        <h2 className="font-bold text-slate-900 mb-1">Active sessions</h2>
        <p className="text-xs text-slate-500 mb-3">If you see a session you don't recognize, sign out of it here.</p>
        {!sessions && <Button type="button" variant="outline" onClick={loadSessions}>Show active sessions</Button>}
        {sessions && (
          <div className="space-y-2">
            {sessions.map((s) => (
              <div key={s.id} className="flex items-center justify-between text-xs bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
                <span>{s.isCurrent ? "This device" : `Session ${s.id}`} {s.createdAt ? `· since ${new Date(s.createdAt).toLocaleDateString()}` : ""}</span>
                {s.isCurrent && <span className="text-emerald-600 font-bold">Current</span>}
              </div>
            ))}
            <Button type="button" variant="outline" onClick={revokeOthers} disabled={busy}>{busy ? "Working…" : "Sign out all other sessions"}</Button>
          </div>
        )}
      </div>
    </div>
  );
}

function ProfilePhoneVerification({ user, onSaved }) {
  const [phone, setPhone] = useState(user.phone || "");
  const [phoneCountry, setPhoneCountry] = useState(user.phoneCountry || "MM");
  const [step, setStep] = useState("idle"); // idle | code
  const [code, setCode] = useState("");
  const [challengeId, setChallengeId] = useState("");
  const [maskedPhone, setMaskedPhone] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [message, setMessage] = useState("");

  const isVerified = !!user.phoneVerified && !!user.phone;

  // Buttons here use type="button" with onClick (not a nested <form>),
  // because this component is rendered inside the outer Profile <form> —
  // the same pattern the "Change password" section below already uses.
  async function sendCode() {
    setError(""); setMessage(""); setLoading(true);
    const res = await api("/auth/phone/link-start", { method: "POST", body: JSON.stringify({ token: user.token, phone, phoneCountry }) });
    setLoading(false);
    if (res.ok) { setChallengeId(res.challengeId); setMaskedPhone(res.maskedPhone || ""); setStep("code"); setCode(""); }
    else setError(res.error || "Could not send the verification code.");
  }

  async function verifyCode() {
    setError(""); setLoading(true);
    const res = await api("/auth/phone/verify", { method: "POST", body: JSON.stringify({ challengeId, code }) });
    setLoading(false);
    if (res.ok) {
      setStep("idle"); setCode("");
      setMessage(res.phoneVerificationReward ? `Phone number verified! +${res.phoneVerificationReward} Credit added to your balance.` : "Phone number verified.");
      onSaved({ ...user, phone: res.user.phone, phoneCountry: res.user.phoneCountry, phoneVerified: res.user.phoneVerified, tsoCoins: res.user.tsoCoins });
    } else setError(res.error || "Incorrect verification code.");
  }

  return (
    <div className="border-t border-slate-200 pt-5">
      <h2 className="font-bold text-slate-900 mb-1">Phone number</h2>
      <p className="text-xs text-slate-500 mb-4">
        {isVerified ? `Verified: ${user.phone}` : "Verify a phone number to receive 10 Credit, one time."}
      </p>
      {isVerified && step === "idle" && (
        <Button type="button" variant="ghost" onClick={() => { setStep("change"); setError(""); setMessage(""); }}>Change phone number</Button>
      )}
      {(!isVerified || step === "change") && step !== "code" && (
        <div className="space-y-3">
          <div className="grid grid-cols-[150px_1fr] gap-2">
            <select value={phoneCountry} onChange={(e) => setPhoneCountry(e.target.value)} className="rounded-xl border border-slate-200 bg-slate-50/60 px-3 py-3 text-sm text-slate-900 outline-none focus:bg-white focus:border-violet-500 focus:ring-4 focus:ring-violet-100">
              {PHONE_COUNTRIES.map(([code, label]) => <option key={code} value={code}>{label}</option>)}
            </select>
            <input value={phone} onChange={(e) => setPhone(e.target.value)} required type="tel" inputMode="tel" autoComplete="tel" placeholder="9 123 4567" className="w-full rounded-xl border border-slate-200 bg-slate-50/60 px-4 py-3 text-[15px] text-slate-900 placeholder-slate-400 outline-none transition focus:bg-white focus:border-violet-500 focus:ring-4 focus:ring-violet-100" />
          </div>
          {error && <p className="text-sm text-red-600 font-semibold">{error}</p>}
          <div className="flex gap-2">
            <Button type="button" onClick={sendCode} disabled={loading || !phone.trim()}>{loading ? "Sending code…" : "Send verification code"}</Button>
            {step === "change" && <Button type="button" variant="ghost" onClick={() => { setStep("idle"); setError(""); }}>Cancel</Button>}
          </div>
        </div>
      )}
      {step === "code" && (
        <div className="space-y-3">
          <p className="text-sm text-slate-600">Enter the 6-digit code sent to {maskedPhone || "your phone"}.</p>
          <TextField label="Verification code" required value={code} onChange={(e) => setCode(e.target.value.replace(/\D/g, "").slice(0, 6))} placeholder="123456" inputMode="numeric" autoFocus autoComplete="one-time-code" />
          {error && <p className="text-sm text-red-600 font-semibold">{error}</p>}
          <div className="flex gap-2">
            <Button type="button" onClick={verifyCode} disabled={loading || code.length !== 6}>{loading ? "Verifying…" : "Verify phone"}</Button>
            <Button type="button" variant="ghost" onClick={() => { setStep("idle"); setCode(""); setError(""); }}>Cancel</Button>
          </div>
        </div>
      )}
      {message && <p className="mt-3 text-sm font-semibold text-emerald-700 bg-emerald-50 rounded-xl p-3">{message}</p>}
    </div>
  );
}

function Profile({ user, onSaved, setView }) {
  const [displayName, setDisplayName] = useState(user.displayName || "");
  const [email, setEmail] = useState(user.email || "");
  const [bio, setBio] = useState(user.bio || "");
  const [avatar, setAvatar] = useState(user.avatar || "");
  const [avatarFile, setAvatarFile] = useState(null);
  const [loading, setLoading] = useState(false);
  const [passwordLoading, setPasswordLoading] = useState(false);
  const [message, setMessage] = useState("");
  const [passwordMessage, setPasswordMessage] = useState("");
  const [error, setError] = useState("");
  const [passwordError, setPasswordError] = useState("");
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");

  const canChangeName = (() => {
    if (!user.nameChangedAt) return true;
    const days = (Date.now() - new Date(user.nameChangedAt).getTime()) / 86400000;
    return days >= 60;
  })();

  async function changePassword(e) {
    e.preventDefault();
    setPasswordError(""); setPasswordMessage(""); setPasswordLoading(true);
    const res = await api("/auth/change-password", {
      method: "POST",
      body: JSON.stringify({
        token: user.token,
        currentPassword,
        newPassword,
        confirmPassword
      })
    });
    setPasswordLoading(false);
    if (res.ok) {
      setCurrentPassword(""); setNewPassword(""); setConfirmPassword("");
      setPasswordMessage("Password changed successfully.");
    } else if (res.error && res.error.includes("session has expired")) {
      setPasswordError(res.error);
      setView("auth");
    } else {
      setPasswordError(res.error || "Could not change your password.");
    }
  }

  async function save(e) {
    e.preventDefault();
    setError(""); setMessage(""); setLoading(true);
    let finalAvatar = avatar;
    if (avatarFile) {
      try { finalAvatar = await resizeImageFile(avatarFile, 512, 0.82); }
      catch (err) { setLoading(false); setError("Could not process that image. Please choose a JPG, PNG, or WebP image."); return; }
    }
    const payload = { token: user.token, email, bio, avatar: finalAvatar };
    if (displayName.trim() !== (user.displayName || "")) payload.displayName = displayName.trim();
    const res = await api("/auth/profile", { method: "PUT", body: JSON.stringify(payload) });
    setLoading(false);
    if (res.ok) {
      setAvatar(res.user.avatar || "");
      setAvatarFile(null);
      onSaved(res.user);
      setMessage(res.user.emailVerified ? "Profile updated successfully." : "Profile updated. Please verify your new email address.");
    } else setError(res.error || "Could not update your profile.");
  }

  return (
    <div className="max-w-2xl mx-auto px-5 py-12">
      <div className="mb-7">
        <h1 className="text-2xl font-extrabold text-slate-900">Your profile</h1>
        <p className="text-sm text-slate-500 mt-1">Update your personal information and profile details.</p>
      </div>
      <form onSubmit={save} className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-5">
        <div className="flex items-center gap-4">
          {avatar ? <img src={avatar} alt="" className="w-16 h-16 rounded-full object-cover border border-slate-200" /> :
            <div className="w-16 h-16 rounded-full bg-violet-100 text-violet-700 flex items-center justify-center text-xl font-extrabold">{(displayName || "?")[0].toUpperCase()}</div>}
          <div>
            <label className="inline-flex items-center gap-2 rounded-xl border-2 border-violet-200 text-violet-700 px-4 py-2.5 text-sm font-bold cursor-pointer hover:bg-violet-50">
              <Icon path={ICONS.upload} size={16} /> Upload from computer
              <input type="file" accept="image/png,image/jpeg,image/webp" className="hidden" onChange={(e) => { const f = e.target.files?.[0]; if (f) setAvatarFile(f); }} />
            </label>
            <div className="text-xs text-slate-400 mt-2">JPG, PNG, or WebP. The image is resized before upload.</div>
            {avatarFile && <div className="text-xs font-semibold text-violet-600 mt-1">Selected: {avatarFile.name}</div>}
          </div>
        </div>
        <TextField label="Name" value={displayName} onChange={(e) => setDisplayName(e.target.value)} disabled={!canChangeName}
          hint={canChangeName ? "You can change your name now. After changing it, the next change is available in 60 days." : "Name changes are locked until 60 days after your last change."} />
        <TextField label="Email" type="email" required value={email} onChange={(e) => setEmail(e.target.value)} hint={user.emailVerified ? "Verified email address." : "Email verification required."} />
        <ProfilePhoneVerification user={user} onSaved={onSaved} />
        <TextArea label="Bio" rows={4} value={bio} onChange={(e) => setBio(e.target.value)} placeholder="Tell people a little about yourself." />
        <TextField label="Profile image URL" value={avatar} onChange={(e) => setAvatar(e.target.value)} placeholder="https://..." />
        <div className="rounded-xl bg-slate-50 border border-slate-200 p-4 text-sm">
          <span className="font-bold">Username:</span> {user.username}
          <span className="text-slate-400 ml-2">(username cannot be changed here)</span>
        </div>
        {error && <p className="text-sm text-red-600 font-semibold">{error}</p>}
        {message && <p className="text-sm text-emerald-600 font-semibold">{message}</p>}

        <div className="border-t border-slate-200 pt-5">
          <h2 className="font-bold text-slate-900 mb-1">Change password</h2>
          <p className="text-xs text-slate-500 mb-4">If the creator gave you a temporary password, enter it as your current password and choose your own password.</p>
          <div className="space-y-4">
            <TextField label="Current password" type="password" value={currentPassword} onChange={(e) => setCurrentPassword(e.target.value)} autoComplete="current-password" />
            <TextField label="New password" type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} hint="At least 6 characters" autoComplete="new-password" />
            <TextField label="Confirm new password" type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} autoComplete="new-password" />
            {passwordError && <p className="text-sm text-red-600 font-semibold">{passwordError}</p>}
            {passwordMessage && <p className="text-sm text-emerald-600 font-semibold">{passwordMessage}</p>}
            <Button type="button" variant="outline" onClick={changePassword}
              disabled={passwordLoading || !currentPassword || !newPassword || !confirmPassword}>
              {passwordLoading ? "Changing…" : "Change password"}
            </Button>
          </div>
        </div>

        <SecuritySettings user={user} />

        <div className="flex gap-3">
          <Button type="submit" className="flex-1" disabled={loading}>{loading ? "Saving…" : "Save changes"}</Button>
          <Button type="button" variant="ghost" onClick={() => setView("browse")}>Cancel</Button>
        </div>
      </form>
    </div>
  );
}

function JobModeration({ adminUsername, adminPassword, onNotify, onJobsChanged }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState("");
  const auth = () => ({ adminUsername, adminPassword });

  async function load() {
    setLoading(true);
    const res = await api("/admin/job-submissions?" + new URLSearchParams(auth()).toString());
    setLoading(false);
    if (res.ok) setItems(res.jobs || []);
    else onNotify(res.error || "Could not load moderation queue.");
  }
  useEffect(() => { load(); }, []);

  async function moderate(job, action) {
    setBusy(job.id + action);
    const reason = action === "reject" ? (window.prompt("Reason for rejection (optional):", "Potential scam, misleading or unsafe job post.") || "Rejected during scam/safety review.") : "";
    if (action === "reject" && reason === null) { setBusy(""); return; }
    const res = await api(`/admin/job-submissions/${encodeURIComponent(job.id)}/${action}`, {
      method: "POST", body: JSON.stringify({ ...auth(), reason })
    });
    setBusy("");
    if (!res.ok) return onNotify(res.error || "Moderation action failed.");
    setItems(prev => prev.filter(x => x.id !== job.id));
    onNotify(res.message || (action === "approve" ? "Post approved." : "Post rejected."));
    await onJobsChanged();
  }

  return (
    <div className="max-w-6xl mx-auto px-5 py-10">
      <div className="mb-7">
        <div className="flex items-center gap-2 text-violet-600 text-xs font-bold uppercase tracking-widest mb-2"><Icon path="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" size={14}/> Trust & Safety</div>
        <div className="flex flex-wrap items-end justify-between gap-3">
          <div><h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Post moderation</h1><p className="text-slate-500 text-sm mt-1">Review registered-user job posts before they become public. Reject scam, misleading, suspicious, or unsafe listings.</p></div>
          <Button variant="ghost" onClick={load}>↻ Refresh</Button>
        </div>
      </div>
      <div className="rounded-2xl border border-amber-200 bg-amber-50 p-4 mb-5 text-sm text-amber-900"><strong>Safety workflow:</strong> user post → pending review → approved and published OR rejected and hidden. A rejected user submission automatically refunds the 2 Credit fee once.</div>
      {loading ? <div className="bg-white rounded-2xl border p-8 text-center text-slate-400">Loading moderation queue…</div> :
       items.length === 0 ? <div className="bg-white rounded-2xl border border-dashed p-12 text-center"><div className="text-4xl mb-3">🛡️</div><p className="font-extrabold text-slate-800">Queue clear</p><p className="text-sm text-slate-500 mt-1">No pending or rejected submissions need attention.</p></div> :
       <div className="space-y-4">{items.map(job => (
         <article key={job.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
           <div className="p-5 sm:p-6">
             <div className="flex flex-wrap items-start justify-between gap-3">
               <div><div className="flex items-center gap-2 mb-2"><Badge tone={job.approvalStatus === "pending" ? "amber" : "slate"}>{job.approvalStatus}</Badge><span className="text-xs text-slate-400">Submitted {job.submittedAt ? new Date(job.submittedAt).toLocaleString() : new Date(job.postedAt).toLocaleString()}</span></div>
                 <h2 className="text-lg font-extrabold text-slate-900">{job.title || "Image job announcement"}</h2>
                 <p className="text-sm text-slate-500 mt-1">{job.company || "—"} · {job.location || "—"} · {job.type || "—"}</p>
                 <p className="text-xs text-slate-400 mt-1">Submitted by @{job.employerUsername || "unknown"}</p>
               </div>
               <div className="flex gap-2"><Button onClick={() => moderate(job, "approve")} disabled={busy}>{busy === job.id+"approve" ? "Approving…" : "✓ Approve & publish"}</Button><Button variant="danger" onClick={() => moderate(job, "reject")} disabled={busy}>{busy === job.id+"reject" ? "Rejecting…" : "✕ Reject"}</Button></div>
             </div>
             {job.imageData ? <img src={job.imageData} alt="Submitted job flyer" className="mt-5 max-h-[420px] w-full object-contain rounded-xl border border-slate-200 bg-slate-50"/> :
               <div className="mt-5 rounded-xl bg-slate-50 border border-slate-200 p-4 space-y-2 text-sm"><p><strong>Category:</strong> {job.category || "—"}</p><p><strong>Pay:</strong> {job.pay || "Not stated"}</p><p className="whitespace-pre-line"><strong>Description:</strong>{"\n"}{job.description || "—"}</p></div>}
             {job.rejectionReason && <div className="mt-4 rounded-xl bg-red-50 border border-red-100 p-3 text-sm text-red-700"><strong>Previous rejection:</strong> {job.rejectionReason}</div>}
           </div>
         </article>
       ))}</div>}
    </div>
  );
}

function CreatorTaskManagement({ adminUsername, adminPassword }) {
  const [users, setUsers] = useState([]);

  const [reason, setReason] = useState("Creator coin reward");

  const [busy, setBusy] = useState(false);
  const [message, setMessage] = useState("");
  const auth = () => ({ adminUsername, adminPassword });

  const [tasks, setTasks] = useState([]);
  const [tasksLoading, setTasksLoading] = useState(true);
  const [newTitle, setNewTitle] = useState("");
  const [newDescription, setNewDescription] = useState("");
  const [newReward, setNewReward] = useState("10");
  const [taskBusy, setTaskBusy] = useState(false);
  const [taskMessage, setTaskMessage] = useState("");

  const [promoCodes, setPromoCodes] = useState([]);
  const [promoLoading, setPromoLoading] = useState(true);
  const [newCode, setNewCode] = useState("");
  const [newCodeCoins, setNewCodeCoins] = useState("10");

  async function load() {
    setLoading(true);
    const res = await api("/creator/users/coins?" + new URLSearchParams(auth()).toString());
    setLoading(false);
    if (res.ok) {
      setUsers(res.users || []);
      if (!selectedUsername && res.users?.length) setSelectedUsername(res.users[0].username);
      setMessage("");
    } else setMessage(res.error || "Could not load users.");
  }
  async function loadTasks() {
    setTasksLoading(true);
    const res = await api("/creator/tasks?" + new URLSearchParams(auth()).toString());
    setTasksLoading(false);
    if (res.ok) setTasks(res.tasks || []);
    else setTaskMessage(res.error || "Could not load tasks.");
  }
  async function loadPromoCodes() {
    setPromoLoading(true);
    const res = await api("/creator/promo-codes?" + new URLSearchParams(auth()).toString());
    setPromoLoading(false);
    if (res.ok) setPromoCodes(res.promoCodes || []);
    else setPromoMessage(res.error || "Could not load promo codes.");
  }
  useEffect(() => { load(); loadTasks(); loadPromoCodes(); }, []);

  async function addCoins(e) {
    e.preventDefault();
    setBusy(true); setMessage("");
    const res = await api("/creator/users/add-coins", {
      method: "POST",
      body: JSON.stringify({ ...auth(), username: selectedUsername, amount: Number(amount), reason })
    });

    if (!res.ok) return setMessage(res.error || "Could not add Credit.");
    setMessage(`${res.displayName || res.username} received +${res.addedCoins} Credit. New balance: ${res.tsoCoins} Credit.`);

    e.preventDefault();
    setTaskBusy(true); setTaskMessage("");

    });
    setTaskBusy(false);
    if (!res.ok) return setTaskMessage(res.error || "Could not create task.");
    setTasks(res.tasks || []);
    setNewTitle(""); setNewDescription(""); setNewReward("10");
    setTaskMessage("Task created — it's now live on the Tasks & Rewards page for every user.");
  }

  async function toggleTask(task) {
    setTaskMessage("");
    const res = await api(`/creator/tasks/${encodeURIComponent(task.id)}`, {
      method: "PATCH",
      body: JSON.stringify({ ...auth(), active: !task.active })
    });
    if (!res.ok) return setTaskMessage(res.error || "Could not update task.");
    setTasks(res.tasks || []);

  async function removeTask(task) {

    const res = await api(`/creator/tasks/${encodeURIComponent(task.id)}`, {
      method: "DELETE",
      body: JSON.stringify(auth())
    });

      method: "POST",
      body: JSON.stringify({ ...auth(), code: newCode, coins: Number(newCodeCoins), maxUses: newCodeMaxUses ? Number(newCodeMaxUses) : null })
    });

      body: JSON.stringify(auth())
    });

        {message && <p className="mt-4 text-sm font-semibold text-violet-700 bg-violet-50 rounded-xl p-3">{message}</p>}

          <button onClick={load} className="text-sm font-bold text-violet-600">Refresh</button>

        {loading ? <p className="p-5 text-sm text-slate-400">Loading users…</p> : users.length === 0 ? <p className="p-5 text-sm text-slate-500">No registered users yet.</p> : (

function CreatorUserManagement({ adminUsername, adminPassword, isOwner, onPasswordNotice }) {
  const [users, setUsers] = useState([]);
  const [creators, setCreators] = useState([]);
  const [displayName, setDisplayName] = useState("");
  const [username, setUsername] = useState("");
  const [email, setEmail] = useState("");
  const [creatorName, setCreatorName] = useState("");
  const [creatorUsername, setCreatorUsername] = useState("");
  const [creatorEmail, setCreatorEmail] = useState("");
  const [busy, setBusy] = useState(false);
  const [creatorBusy, setCreatorBusy] = useState(false);
  const [message, setMessage] = useState("");
  const [mailboxes, setMailboxes] = useState([]);
  const [mailboxDomain, setMailboxDomain] = useState("talentshowoff.com");
  const [mailboxConfigured, setMailboxConfigured] = useState(true);

  const auth = () => ({ adminUsername, adminPassword });

  async function load() {
    const q = new URLSearchParams(auth()).toString();
    const requests = [api("/creator/users?" + q)];
    if (isOwner) requests.push(api("/admin/creators?" + q), api("/admin/mailboxes?" + q));
    const [userRes, creatorRes, mailboxRes] = await Promise.all(requests);
    if (userRes.ok) setUsers(userRes.users);
    else setMessage(userRes.error || "Could not load users.");
    if (isOwner && creatorRes?.ok) setCreators(creatorRes.creators);
    else if (isOwner) setMessage(creatorRes?.error || "Could not load creator accounts.");
    if (isOwner && mailboxRes?.ok) {
      setMailboxes(mailboxRes.mailboxes || []);
      setMailboxDomain(mailboxRes.domain || "talentshowoff.com");
      setMailboxConfigured(true);
    } else if (isOwner) {
      setMailboxes([]);
      setMailboxConfigured(mailboxRes?.configured !== false);
    }
  }
  useEffect(() => { load(); }, []);

  async function create(e) {
    if (!isOwner) return;
    e.preventDefault(); setBusy(true); setMessage("");
    const res = await api("/admin/users", { method:"POST", body:JSON.stringify({...auth(), username, displayName, email}) });
    setBusy(false);
    if (!res.ok) return setMessage(res.error || "Could not create user.");
    setMessage(`User account created. Generated password: ${res.generatedPassword}${res.emailed ? " — emailed to the user." : " — Resend email was not sent."}`);
    setUsername(""); setDisplayName(""); setEmail(""); load();
  }

  async function resetUser(user) {
    if (!isOwner) return;
    if (!window.confirm(`Reset the password for ${user.username}?`)) return;
    const res = await api("/admin/users/reset-password", { method:"POST", body:JSON.stringify({...auth(), username:user.username}) });
    if (res.ok) {
      setMessage(`New password for ${user.username}: ${res.generatedPassword}${res.emailed ? " — emailed to the user." : ""}`);
      onPasswordNotice(res.generatedPassword);
    } else setMessage(res.error || "Could not reset password.");
  }

  async function removeUser(user) {
    if (!isOwner) return;
    if (!window.confirm(`Remove registered account "${user.username}"? This permanently removes the account and its Credit history.`)) return;
    const res = await api("/admin/users", { method:"DELETE", body:JSON.stringify({...auth(), username:user.username}) });
    if (res.ok) { setMessage(`Registered account ${user.username} was removed.`); load(); }
    else setMessage(res.error || "Could not remove user account.");
  }

    if (!isOwner) return;
    e.preventDefault(); setCreatorBusy(true); setMessage("");

      method:"POST",

/* ---------- TSO AI — 3D character (glTF model rendered via <model-viewer>) ---------- */
// width defaults to size, height defaults to a taller box (the standing
// figure's own proportions are roughly 1 wide : 2 tall) so the full body
// is visible instead of being squeezed into a square launcher bubble.
function TSOAvatar3D({ size = 96, height, onClick, className = "", title = "TSO AI Assistant", onLoadError, welcoming = false, talking = false, expression = "" }) {
  const ref = useRef(null);
  const modelReadyRef = useRef(false);
  const boxHeight = height || Math.round(size * 1.9);

  // TSO AI character v2 (Aug 2026 upgrade): higher-detail sculpt, deduplicated
  // from a multi-instance source export and rigged as two nodes (Body root +
  // Head child pivoting at the neck). The source mesh has no separable
  // arm/eyelid/jaw geometry (a single fused sculpt), so Wave/Talk/Happy/
  // Smile/Wink are all expressed through head-tilt, timing, and whole-body
  // motion rather than facial or hand animation — a deliberate choice over
  // a broken/torn geometry cut. All 6 clips (Idle + the 5 below) are
  // present so existing chat-event wiring keeps working unchanged.
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const setup = () => {
      try {
        el.jumpCameraToGoal();
        modelReadyRef.current = true;
        if (el.availableAnimations && el.availableAnimations.includes("Idle")) {
          el.animationName = "Idle";
          el.play({ repetitions: Infinity });
        }
      } catch (_) {}
    };
    el.addEventListener("load", setup);
    setup();
    return () => el.removeEventListener("load", setup);
  }, []);

  // Play the one-shot "Wave" greeting clip, then fall back to the looping
  // idle animation once it finishes.
  useEffect(() => {
    const el = ref.current;
    if (!el || !modelReadyRef.current || !welcoming) return;
    try {
      el.animationName = "Wave";
      el.play({ repetitions: 1 });
      const onFinished = () => {
        try {
          el.animationName = "Idle";
          el.play({ repetitions: Infinity });
        } catch (_) {}
      };
      el.addEventListener("finished", onFinished, { once: true });
      return () => el.removeEventListener("finished", onFinished);
    } catch (_) {}
  }, [welcoming]);

  // While TSO is actively responding, loop the mouth-movement "Talk" clip;
  // otherwise settle back on the idle breathing loop.
  useEffect(() => {
    const el = ref.current;
    if (!el || !modelReadyRef.current) return;
    try {
      if (talking) {
        el.animationName = "Talk";
        el.play({ repetitions: Infinity });
      } else if (!welcoming) {
        el.animationName = "Idle";
        el.play({ repetitions: Infinity });
      }
    } catch (_) {}
  }, [talking]);

  // One-shot facial expressions ("happy", "smile", "wink") triggered from
  // outside (e.g. after a positive chat reply, or on tap). Falls back to
  // Idle once the clip finishes, unless still talking/welcoming.
  useEffect(() => {
    const el = ref.current;
    if (!el || !modelReadyRef.current || !expression || talking || welcoming) return;
    const clipName = { happy: "Happy", smile: "Smile", wink: "Wink" }[expression];
    if (!clipName) return;
    try {
      el.animationName = clipName;
      el.play({ repetitions: 1 });
      const onFinished = () => {
        try {
          el.animationName = "Idle";
          el.play({ repetitions: Infinity });
        } catch (_) {}
      };
      el.addEventListener("finished", onFinished, { once: true });
      return () => el.removeEventListener("finished", onFinished);
    } catch (_) {}
  }, [expression]);

  return (
    <model-viewer
      ref={ref}
      src="/tso-ai-robot.glb"
      alt={title}
      camera-controls
      touch-action="none"
      min-camera-orbit="auto 5deg auto"
      max-camera-orbit="auto 175deg auto"
      disable-zoom
      disable-pan
      interaction-prompt="none"
      shadow-intensity="0.85"
      shadow-softness="1"
      exposure="1.12"
      environment-image="neutral"
      reveal="auto"
      autoplay
      animation-name="Idle"
      onError={() => onLoadError && onLoadError()}
      onClick={onClick}
      title={title}
      className={`tso-avatar-standing ${welcoming ? "tso-avatar-welcome" : ""} ${className}`}
      style={{ width: size, height: boxHeight, cursor: onClick ? "pointer" : "default", background: "transparent", "--poster-color": "transparent", "--progress-bar-color": "transparent", "--progress-mask": "transparent" }}
    />
  );
}

// Reads a File into { name, mimeType, dataUrl, data (base64, no prefix) }.
function readFileAsAttachment(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const base64 = String(dataUrl).split(",", 2)[1] || "";
      resolve({ name: file.name, mimeType: file.type || "application/octet-stream", size: file.size, dataUrl, data: base64 });
    };
    reader.onerror = () => reject(new Error("Could not read file."));
    reader.readAsDataURL(file);
  });
}

// Renders a Turbo Agent reply that may contain markdown-style elements —
// "| a | b |" tables (comparison tables, Job/Match/Reason tables),
// "- item" / "1. item" lists (Key findings, Sources), and short standalone
// header lines (Summary, Sources, etc.) — as real HTML instead of raw
// symbols, so multi-step research/agent replies are easy to scan at a
// glance. Falls back to plain whitespace-pre-line text when none of that
// markup is present.
function TSOAIRichText({ text }) {
  const lines = (text || "").split("\n");
  const blocks = [];
  let buffer = [];

  function flushText() {
    if (buffer.length) {
      blocks.push({ type: "text", content: buffer.join("\n") });
      buffer = [];
    }
  }

  const BULLET_RE = /^\s*[-*]\s+(.*)$/;
  const NUMBERED_RE = /^\s*\d+[.)]\s+(.*)$/;
  // A short (<=40 char) standalone line with no sentence punctuation, not
  // itself a bullet/number/table row — used for the report's own section
  // titles ("Summary", "Key findings", "Sources", "Where sources disagree").
  const HEADER_RE = /^[A-Z][A-Za-z0-9 ,'’&/-]{1,40}$/;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const isTableRow = /^\s*\|.*\|\s*$/.test(line);
    const isSeparatorRow = /^\s*\|?[\s:|-]+\|[\s:|-]*\|?\s*$/.test(line) && line.includes("-");

    if (isTableRow && !isSeparatorRow) {
      // Peek ahead: a real table needs a header row followed by a
      // "|---|---|" separator row right after it.
      const next = lines[i + 1] || "";
      if (/^\s*\|?[\s:|-]+\|[\s:|-]*\|?\s*$/.test(next) && next.includes("-")) {
        flushText();
        const tableLines = [line];
        let j = i + 1;
        while (j < lines.length && /^\s*\|.*\|\s*$/.test(lines[j])) {
          tableLines.push(lines[j]);
          j++;
        }
        blocks.push({ type: "table", content: tableLines });
        i = j - 1;
        continue;
      }
    }

    if (BULLET_RE.test(line) || NUMBERED_RE.test(line)) {
      flushText();
      const ordered = NUMBERED_RE.test(line);
      const items = [];
      let j = i;
      while (j < lines.length) {
        const m = ordered ? lines[j].match(NUMBERED_RE) : lines[j].match(BULLET_RE);
        if (!m) break;
        items.push(m[1]);
        j++;
      }
      blocks.push({ type: "list", ordered, content: items });
      i = j - 1;
      continue;
    }

    if (HEADER_RE.test(line.trim()) && line.trim().length > 0) {
      flushText();
      blocks.push({ type: "header", content: line.trim() });
      continue;
    }

    buffer.push(line);
  }
  flushText();

  if (blocks.length === 1 && blocks[0].type === "text") {
    return <div className="whitespace-pre-line">{text}</div>;
  }

  return (
    <div className="space-y-2">
      {blocks.map((block, bi) => {
        if (block.type === "text") {
          const trimmed = block.content.replace(/^\n+|\n+$/g, "");
          if (!trimmed) return null;
          return <div key={bi} className="whitespace-pre-line">{trimmed}</div>;
        }

        if (block.type === "header") {
          return (
            <div key={bi} className="text-[11px] font-extrabold uppercase tracking-wide text-violet-600 mt-2 first:mt-0">
              {block.content}
            </div>
          );
        }

        if (block.type === "list") {
          const Tag = block.ordered ? "ol" : "ul";
          return (
            <Tag key={bi} className={`space-y-1 pl-5 ${block.ordered ? "list-decimal" : "list-disc"} marker:text-violet-400`}>
              {block.content.map((item, ii) => (
                <li key={ii}>{item}</li>
              ))}
            </Tag>
          );
        }

        // Table block
        const rows = block.content
          .filter((_, idx) => idx !== 1) // drop the |---|---| separator row
          .map((row) => row.trim().replace(/^\||\|$/g, "").split("|").map((cell) => cell.trim()));
        const [header, ...body] = rows;
        return (
          <div key={bi} className="overflow-x-auto -mx-1">
            <table className="min-w-full text-xs border-collapse">
              <thead>
                <tr>
                  {header.map((h, hi) => (
                    <th key={hi} className="text-left font-extrabold text-violet-700 bg-violet-50 px-2.5 py-2 border border-violet-100 first:rounded-tl-lg last:rounded-tr-lg">{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {body.map((row, ri) => (
                  <tr key={ri} className={ri % 2 === 0 ? "bg-white" : "bg-slate-50"}>
                    {row.map((cell, ci) => (
                      <td key={ci} className="px-2.5 py-2 border border-slate-100 align-top">{cell}</td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      })}
    </div>
  );
}


// Renders Turbo Visualize diagram data ({type:"flow"|"map", nodes, edges})
// as a simple interactive SVG: "flow" lays nodes out left-to-right in
// sequence order, "map" lays them out in a ring so relationships read
// as a network rather than a line. No charting library needed — this is
// deliberately small and dependency-free like the rest of Turbo's tools.
function DiagramView({ diagram }) {
  const [active, setActive] = React.useState(null);
  const nodes = diagram.nodes || [];
  const edges = diagram.edges || [];
  const isFlow = diagram.type === "flow";
  const w = 640, h = Math.max(220, isFlow ? 220 : 120 + nodes.length * 46);
  const positions = {};
  if (isFlow) {
    const step = nodes.length > 1 ? (w - 120) / (nodes.length - 1) : 0;
    nodes.forEach((n, i) => { positions[n.id] = { x: 60 + i * step, y: h / 2 }; });
  } else {
    const cx = w / 2, cy = h / 2, r = Math.min(w, h) / 2 - 70;
    nodes.forEach((n, i) => {
      const angle = (2 * Math.PI * i) / Math.max(1, nodes.length) - Math.PI / 2;
      positions[n.id] = { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
    });
  }
  const activeNode = nodes.find(n => n.id === active);
  return (
    <div className="border rounded-2xl overflow-hidden bg-white">
      {diagram.title && <div className="px-4 py-2.5 border-b bg-slate-50 text-sm font-bold text-slate-800">{diagram.title}</div>}
      <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ minHeight: 180 }}>
        {edges.map((e, i) => {
          const a = positions[e.from], b = positions[e.to];
          if (!a || !b) return null;
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          return (
            <g key={i}>
              <line x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke="#c4b5fd" strokeWidth="2" markerEnd="url(#arrow)" />
              {e.label && <text x={mx} y={my - 6} textAnchor="middle" fontSize="9" fill="#7c3aed" fontWeight="700">{e.label}</text>}
            </g>
          );
        })}
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#c4b5fd" />
          </marker>
        </defs>
        {nodes.map((n) => {
          const p = positions[n.id];
          if (!p) return null;
          const isActive = active === n.id;
          return (
            <g key={n.id} onClick={() => setActive(isActive ? null : n.id)} style={{ cursor: "pointer" }}>
              <rect x={p.x - 58} y={p.y - 20} width="116" height="40" rx="12"
                fill={isActive ? "#7c3aed" : "#ffffff"} stroke="#7c3aed" strokeWidth="2" />
              <text x={p.x} y={p.y + 4} textAnchor="middle" fontSize="11" fontWeight="700"
                fill={isActive ? "#ffffff" : "#4c1d95"}>{(n.label || "").slice(0, 20)}</text>
            </g>
          );
        })}
      </svg>
      {activeNode?.note && (
        <div className="px-4 py-3 border-t bg-violet-50 text-xs text-violet-800">{activeNode.note}</div>
      )}
      {!activeNode && <div className="px-4 py-2 border-t text-[11px] text-slate-400">Tap a node for details.</div>}
    </div>
  );
}

function TurboSubscribeModal({ user, onClose, onSubscribed }) {
  const [info, setInfo] = useState(null);
  const [loadingInfo, setLoadingInfo] = useState(true);
  const [planId, setPlanId] = useState("");
  const [paymentMethod, setPaymentMethod] = useState("");
  const [screenshot, setScreenshot] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const [success, setSuccess] = useState("");
  const [purchases, setPurchases] = useState([]);

  async function loadInfo() {
    const res = await api("/turbo/plans");
    if (res.ok) {
      setInfo(res);
      if (!planId && res.plans.length) setPlanId(res.plans[0].id);
      if (!paymentMethod && res.paymentMethods.length) setPaymentMethod(res.paymentMethods[0]);
    }
    setLoadingInfo(false);
  }
  async function loadPurchases() {
    if (!user) return;
    const res = await api("/turbo/purchases?token=" + encodeURIComponent(user.token));
    if (res.ok) setPurchases(res.purchases || []);
  }
  useEffect(() => { loadInfo(); loadPurchases(); }, []);

  async function submit(e) {
    e.preventDefault();
    setError(""); setSuccess("");
    if (!user) return setError("Please sign in to subscribe to Turbo.");
    if (!planId) return setError("Please choose a Turbo plan.");
    if (!paymentMethod) return setError("Please choose a payment method.");
    if (!screenshot) return setError("Please upload a screenshot of your payment transfer.");
    setSubmitting(true);
    const res = await api("/turbo/purchases", {
      method: "POST",
      body: JSON.stringify({ token: user.token, planId, paymentMethod, screenshot }),
    });
    setSubmitting(false);
    if (!res.ok) { setError(res.error || "Could not submit your Turbo subscription."); return; }
    setSuccess(res.message || "Submitted! A creator will review your payment shortly.");
    setScreenshot(null);
    await loadPurchases();
    if (onSubscribed) onSubscribed();
  }

  const selectedPlan = info?.plans.find(p => p.id === planId);

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 p-0 sm:p-4">

        </div>

        <div className="p-5">
          <p className="text-sm text-slate-500 mb-5">Turbo gives TSO AI live, AI-powered search grounded in real-time Google results — and answers roughly 2x faster than Neo. Pay by mobile money, upload your transfer screenshot, and a creator will activate Turbo once verified.</p>

          <div className="rounded-2xl border border-slate-200 overflow-hidden mb-6">
            <table className="w-full text-sm">
              <thead>
                <tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
                  <th className="text-left font-bold px-4 py-2.5">Feature</th>
                  <th className="text-center font-bold px-3 py-2.5 w-24">Neo</th>
                  <th className="text-center font-bold px-3 py-2.5 w-24 text-violet-700">Turbo</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {[
                  ["Response speed", "Standard", "~2x faster"],
                  ["Live web search", "Basic snippets", "Real-time, AI-grounded"],
                  ["Understands photos & files", false, true],
                  ["Answer quality", "Good", "Smarter, more detailed"],
                  ["Search freshness", "May be outdated", "Always current"],
                  ["Priority during busy hours", false, true],
                  ["Chat history storage", "500 MB", "1 GB"],
                  ["Price", "Free", "20,000 Ks / month"],
                ].map(([label, neoVal, turboVal]) => (
                  <tr key={label}>
                    <td className="px-4 py-2.5 font-semibold text-slate-700">{label}</td>
                    <td className="px-3 py-2.5 text-center text-slate-500">
                      {typeof neoVal === "boolean" ? (neoVal ? <span className="text-emerald-600 font-bold">✓</span> : <span className="text-slate-300 font-bold">✕</span>) : neoVal}
