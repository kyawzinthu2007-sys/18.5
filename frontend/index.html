function FeatureScout({adminUsername, adminPassword, creatorToken, onNotify}) {
  const [query,setQuery]=useState("");
  const [urls,setUrls]=useState("");
  const [items,setItems]=useState([]);
  const [loading,setLoading]=useState(false);
  const [message,setMessage]=useState("");
  const [building,setBuilding]=useState("");
  const [applying,setApplying]=useState("");
  const auth=()=>({username:adminUsername,password:adminPassword,token:creatorToken});
  const load=async()=>{ const params=creatorToken ? "token="+encodeURIComponent(creatorToken) : "username="+encodeURIComponent(adminUsername)+"&password="+encodeURIComponent(adminPassword); const r=await api("/creator/feature-scout?"+params); if(r.ok)setItems(r.proposals||[]); };
  useEffect(()=>{load()},[]);
  const search=async()=>{
    setLoading(true); setMessage("");
    const r=await api("/creator/feature-scout/search",{method:"POST",body:JSON.stringify({...auth(),query,urls:urls.split(/\n|,/).map(x=>x.trim()).filter(Boolean)})});
    setLoading(false);
    if(!r.ok){setMessage(r.error||"Research failed.");return;}
    setMessage((r.proposals||[]).length+" feature proposal(s) found. Review them below.");
    await load();
  };
  const draft=async(id)=>{
    const r=await api(`/creator/feature-scout/${id}/draft`,{method:"POST",body:JSON.stringify(auth())});
    if(r.ok){setItems(x=>x.map(p=>p.id===id?{...p,draft:r.draft}:p));} else setMessage(r.error||"Draft failed.");
  };
  const review=async(id,action)=>{
    const r=await api(`/creator/feature-scout/${id}/review`,{method:"POST",body:JSON.stringify({...auth(),action})});
    if(r.ok){setItems(x=>x.map(p=>p.id===id?{...p,status:r.proposal.status}:p));onNotify?.("Feature status updated.");}
    else setMessage(r.error||"Could not update proposal.");
  };
  const buildCode=async(id)=>{
    setBuilding(id); setMessage("");
    const r=await api(`/creator/feature-scout/${id}/build-code`,{method:"POST",body:JSON.stringify(auth())});
    setBuilding("");
    if(r.ok){setItems(x=>x.map(p=>p.id===id?{...p,codePlan:r.codePlan}:p));onNotify?.("Implementation code generated for creator review.");}
    else setMessage(r.error||"Code generation failed.");
  };
  const applyCode=async(id)=>{
    setApplying(id); setMessage("");
    const r=await api(`/creator/feature-scout/${id}/apply`,{method:"POST",body:JSON.stringify(auth())});
    setApplying("");
    if(r.ok){
      setItems(x=>x.map(p=>p.id===id?{...p,status:"implemented_review",githubResult:r.github}:p));
      setMessage(`Code added to review branch ${r.github?.branch||""}. Production was not changed.`);
    } else setMessage(r.error||"Could not create review branch.");
  };
  return <div className="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div className="rounded-3xl border border-violet-100 bg-gradient-to-br from-violet-50 to-white p-6 shadow-sm">
      <div className="flex items-start justify-between gap-4 flex-wrap">
        <div><Badge tone="violet">TSO Feature Scout</Badge>
          <h2 className="text-2xl font-extrabold text-slate-900 mt-3">Discover features from the web</h2>
          <p className="text-sm text-slate-600 mt-1 max-w-2xl">TSO researches public pages, identifies product-level ideas, and prepares an independent implementation draft. Nothing is added to production without your approval.</p>
        </div>
        <div className="text-xs text-slate-500 max-w-xs">No passwords, cookies, private pages, source code, or copied branding are collected.</div>
      </div>
      <div className="grid md:grid-cols-2 gap-4 mt-6">
        <TextArea label="What should TSO look for?" value={query} onChange={e=>setQuery(e.target.value)} placeholder="e.g. new features on modern job boards, candidate matching, employer profiles" rows={5}/>
        <TextArea label="Optional public URLs (one per line)" value={urls} onChange={e=>setUrls(e.target.value)} placeholder="https://example.com/jobs\nhttps://example.org" rows={5}/>
      </div>
      <button onClick={search} disabled={loading} className="mt-4 px-5 py-3 rounded-xl bg-violet-600 text-white font-bold hover:bg-violet-700 disabled:opacity-50">{loading?"Researching…":"Search & analyze features"}</button>
      {message && <div className="mt-3 text-sm text-slate-600">{message}</div>}
    </div>
    <div className="mt-6 space-y-4">
      {items.length===0 && <div className="rounded-2xl border border-slate-200 p-8 text-center text-slate-500">No proposals yet. Start a research scan above.</div>}
      {items.map(p=><div key={p.id} className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <div className="flex items-start justify-between gap-3">
          <div><h3 className="font-extrabold text-slate-900">{p.title}</h3><div className="mt-2"><Badge tone={p.status==="approved"?"green":p.status==="rejected"?"slate":p.status==="build_queue"?"amber":"violet"}>{p.status.replace("_"," ")}</Badge></div></div>
          <div className="flex gap-2 flex-wrap justify-end">
            {!p.draft && <button onClick={()=>draft(p.id)} className="px-3 py-2 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold">Generate build draft</button>}
            {p.draft && !p.codePlan && <button onClick={()=>buildCode(p.id)} disabled={building===p.id} className="px-3 py-2 rounded-lg bg-blue-600 text-white text-xs font-bold">{building===p.id?"Building code…":"Build code for review"}</button>}
            {p.status==="pending" && <><button onClick={()=>review(p.id,"approve")} className="px-3 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold">Approve idea</button><button onClick={()=>review(p.id,"reject")} className="px-3 py-2 rounded-lg bg-red-50 text-red-600 text-xs font-bold">Reject</button></>}
            {p.status==="approved" && <button onClick={()=>review(p.id,"queue")} className="px-3 py-2 rounded-lg bg-violet-600 text-white text-xs font-bold">Add to build queue</button>}
            {p.codePlan && ["approved","build_queue"].includes(p.status) && <button onClick={()=>applyCode(p.id)} disabled={applying===p.id} className="px-3 py-2 rounded-lg bg-amber-600 text-white text-xs font-bold">{applying===p.id?"Adding…":"Add code to review branch"}</button>}
          </div>
        </div>
        <p className="text-sm text-slate-600 mt-3">{p.analysis?.recommendation || p.analysis?.description || ""}</p>
        {p.analysis?.evidence_urls?.length>0 && <div className="mt-3 text-xs text-slate-500">Evidence: {p.analysis.evidence_urls.slice(0,3).map(u=><span key={u} className="inline-block mr-2">{u}</span>)}</div>}
        {p.codePlan && <details className="mt-4" open><summary className="cursor-pointer font-bold text-sm text-blue-700">Review generated code before adding</summary>
          <div className="mt-3 text-xs text-slate-600 mb-2">{p.codePlan.summary||"Generated implementation plan"}</div>
          <pre className="whitespace-pre-wrap text-xs bg-slate-900 text-white rounded-xl p-4 overflow-auto max-h-96">{JSON.stringify(p.codePlan,null,2)}</pre>
        </details>}
        {p.githubResult && <div className="mt-3 text-xs rounded-xl bg-amber-50 p-3 text-amber-800">Review branch: <a className="underline font-bold" href={p.githubResult.review_url} target="_blank" rel="noreferrer">{p.githubResult.branch}</a>. Base branch: {p.githubResult.base_branch}. Production was not changed.</div>}
        {p.buildError && <div className="mt-3 text-xs rounded-xl bg-red-50 p-3 text-red-700">Build/GitHub error: {p.buildError}</div>}
        {p.draft && <details className="mt-4"><summary className="cursor-pointer font-bold text-sm text-violet-700">View independent implementation draft</summary>
          <pre className="mt-3 whitespace-pre-wrap text-xs bg-slate-50 rounded-xl p-4 overflow-auto">{JSON.stringify(p.draft,null,2)}</pre>
        </details>}
      </div>)}
    </div>
  </div>;
}

    setMeta('meta[property="og:title"]', "property", title);

      }
      return true;
    }).sort((a, b) => new Date(b.postedAt) - new Date(a.postedAt));

  async function handlePostJob(job) {
    try {
      const res = await api("/jobs", { method: "POST", body: JSON.stringify({ job, token: user?.token, adminUsername: adminUsername, adminPassword: adminPasswordRef.current }) });
      if (res.ok) {
        apiMutated("/jobs");
        if (!isAdmin && user && typeof res.tsoCoins === "number") setUser(prev => prev ? { ...prev, tsoCoins: res.tsoCoins } : prev);
        showToast(res.approvalStatus === "pending"
          ? `Submitted for admin review${res.chargedCoins ? ` · ${res.chargedCoins} Credit reserved` : ""}.`
          : (res.chargedCoins ? `Post published. ${res.chargedCoins} Credit used.` : "Post published successfully!"));
        setView("browse");
        setSelectedJob(null);
        setEditingJob(null);
        await refreshJobs();
      } else {
        showToast(res.error || "Couldn't publish the post. Please sign in again.");
        if (res.requiredCoins && user && typeof res.tsoCoins === "number") setTimeout(() => setView("tasks"), 500);
      }
    } catch (err) {
      console.error(err);
      showToast("Server connection failed. Make sure the Talentshowoff server is running.");
    }
  }
  async function handleJobView(jobId) {
    try {
      const res = await api("/jobs/" + jobId + "/view", {
        method: "POST",
        body: JSON.stringify({ token: user?.token || "" })
      });
      if (res.ok && typeof res.viewCount === "number") {
        setJobs(prev => prev.map(j => j.id === jobId ? { ...j, viewCount: res.viewCount } : j));
        setSelectedJob(prev => prev && prev.id === jobId ? { ...prev, viewCount: res.viewCount } : prev);
      }
    } catch (err) {
      console.warn("Could not record job view", err);
    }
  }
  async function handleUpdateJob(updated) {
    const res = await api("/jobs/" + updated.id, { method: "PUT", body: JSON.stringify({ job: updated, adminUsername: adminUsername, adminPassword: adminPasswordRef.current }) });
    if (res.ok) { apiMutated("/jobs"); showToast("Post updated."); setEditingJob(null); setView("browse"); refreshJobs(); setSelectedJob(null); }
    else showToast(res.error || "Couldn't update.");
  }
  async function handleDeleteJob(jobId) {
    const res = await api("/jobs/" + jobId, { method: "DELETE", body: JSON.stringify({ adminUsername: adminUsername, adminPassword: adminPasswordRef.current }) });
    if (res.ok) { apiMutated("/jobs"); showToast("Post deleted."); setSelectedJob(null); setView("browse"); refreshJobs(); }
    else showToast(res.error || "Couldn't delete.");
  }
  async function handleApply(jobId, applicant) {
    // The application endpoint authenticates users with the server-issued session token.
    // Do not rely on username alone because the server intentionally ignores it for authentication.
    const currentUser = user || session.get("tso:currentUser", null);
    if (!currentUser?.token) {
      showToast("Your sign-in session has expired. Please sign in again.");
      setView("auth");
      return;
    }
    const res = await api("/applications", {
      method: "POST",
      body: JSON.stringify({ jobId, token: currentUser.token, ...applicant })
    });
    if (res.ok) {
      showToast("Application sent!");
      await refreshUserApplications(currentUser.username, currentUser.token);
      setView("dashboard");
    } else if (res.error === "Please sign in before applying for a role.") {
      showToast("Your sign-in session has expired. Please sign in again.");
      setUser(null);
      session.remove("tso:currentUser");
      setView("auth");
    } else {
      showToast(res.error || "Couldn't submit application.");
    }
  }
  function handleAuthed(u) {
    setUser(u);
    if (u.isCreator) {
      adminPasswordRef.current = passwordForUnifiedCreatorLogin;
      setAdminPassword(passwordForUnifiedCreatorLogin);
      setAdminUsername(u.username);
      setIsAdmin(true);
      session.set("tso:creatorUsername", u.username);
      showToast(`Welcome, ${u.displayName}! Creator access enabled.`);
    } else {
      const rewardParts = [];
      if (u.dailyLoginReward) rewardParts.push(`+${u.dailyLoginReward} Credit for today's login`);
      if (u.phoneVerificationReward) rewardParts.push(`+${u.phoneVerificationReward} Credit for verifying your phone`);
      showToast(rewardParts.length ? `Welcome, ${u.displayName}! ${rewardParts.join(", ")}.` : `Welcome, ${u.displayName}!`);
    }
    setView("browse");
  }
  // A creator who signed in through the unified email box (isCreator: true) occupies
  // BOTH the `user` slot and the `isAdmin`/`adminUsername` slot at once. Either logout
  // button must clear both, or the other slot's stale session lingers and the account
  // still appears "signed in" after sign-out.
  function handleLogout() {
    const wasUnifiedCreator = !!(user && user.isCreator);
    setUser(null); setUserApplications([]); setApplications([]);
    if (wasUnifiedCreator || isAdmin) handleAdminLogout();
    showToast("Signed out.");
    setView("browse");
  }

  const adminPasswordRef = useRef("");
  function handleAdminLogout() {
    adminPasswordRef.current = "";
    setAdminUsername("");
    setIsAdmin(false);
    session.remove("tso:creatorUsername"); session.remove("tso:creatorPassword"); setAdminPassword("");
    setApplications([]);
    if (user && user.isCreator) { setUser(null); setUserApplications([]); }
    showToast("Signed out of creator account.");
    setView("browse");
  }

  const [openTSOSignal, setOpenTSOSignal] = useState(0);
  // Versioned upgrade notices: every future release can change this single
  // version string and all users will see the new announcement once.
  const UPGRADE_NOTICE_VERSION = "2026-08-credit-v3";
  const [showUpgradeAnnouncement, setShowUpgradeAnnouncement] = useState(false);
  const [upgradeBanner, setUpgradeBanner] = useState(false);
  useEffect(() => {
    if (user && !isAdmin) {
      try {
        const key = `tso:upgrade-notice:${UPGRADE_NOTICE_VERSION}`;
        const dismissed = localStorage.getItem(key) === "1";
        setShowUpgradeAnnouncement(!dismissed);
        setUpgradeBanner(dismissed);
      } catch (_) { setShowUpgradeAnnouncement(true); setUpgradeBanner(false); }
    } else { setShowUpgradeAnnouncement(false); setUpgradeBanner(false); }
  }, [user, isAdmin]);
  const closeUpgradeAnnouncement = useCallback(() => {
    try { localStorage.setItem(`tso:upgrade-notice:${UPGRADE_NOTICE_VERSION}`, "1"); } catch (_) {}
    setShowUpgradeAnnouncement(false);
    setUpgradeBanner(true);
  }, []);

  // Right-click and drag-copy friction only. This is cosmetic — it deters
  // casual copying but does not and cannot prevent access to page source,
  // DevTools, or network requests (the browser has already downloaded the
  // full HTML/CSS/JS before any of this runs, and DevTools can always be
  // opened from the browser's own menu). No warning is shown; the actions
  // are simply no-ops. Text fields remain selectable (see CSS above).
  useEffect(() => {
    const suppress = (e) => e.preventDefault();
    document.addEventListener("contextmenu", suppress, true);
    document.addEventListener("dragstart", suppress, true);
    return () => {
      document.removeEventListener("contextmenu", suppress, true);
      document.removeEventListener("dragstart", suppress, true);
    };
  }, []);

  if (standaloneMailToken) {
    const standaloneUser = { token: standaloneMailToken, username: "creator" };
    return (
      <div className="min-h-screen text-slate-900" style={{ background: "#faf9fd" }}>
        <header className="sticky top-0 z-40 relative overflow-hidden" style={{ background: "linear-gradient(115deg, #100c34 0%, #211a6b 38%, #5b21b6 72%, #8b19a8 100%)" }}>
          <div aria-hidden="true" className="absolute -top-10 right-10 w-40 h-40 rounded-full opacity-40 blur-3xl" style={{ background: "radial-gradient(circle, #c026d3 0%, transparent 70%)" }} />
          <div aria-hidden="true" className="absolute top-2 right-24 text-fuchsia-300/70" style={{ fontSize: 22, lineHeight: 1 }}>✦</div>
          <div className="relative max-w-6xl mx-auto px-5 py-4 flex items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <div className="relative w-11 h-11 shrink-0">
                <div aria-hidden="true" className="absolute inset-0 rounded-2xl blur-md opacity-60" style={{ background: "radial-gradient(circle, #a78bfa 0%, transparent 70%)" }} />
                <img src="/mail-logo.jpg" alt="TSO Mail" className="relative w-11 h-11 rounded-2xl object-cover ring-1 ring-white/20" />
              </div>
              <div className="leading-tight">
                <div className="font-extrabold text-[18px] tracking-tight text-white">TSO <span style={{ color: "#e9b8ff" }}>Mail</span></div>
                <div className="text-[10px] font-bold tracking-wider text-violet-200/80 uppercase">Private creator workspace</div>
              </div>
            </div>
            <button type="button" onClick={() => window.close()} className="px-3.5 py-2 rounded-xl text-sm font-bold text-white/90 hover:bg-white/10 transition">Close</button>
          </div>
        </header>
        <main className="min-h-[calc(100vh-73px)] tso-fast-shell">
          <Mail user={standaloneUser} onNotify={(msg) => window.alert(msg)} />
        </main>
      </div>
    );
  }

  if (isTsoAiPage) {
    return <TSOAIPage isAdmin={isAdmin} adminUsername={adminUsername} adminPassword={adminPassword} user={user} />;
  }

  return (
    <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col">
      <Header user={user} isAdmin={isAdmin} adminUsername={adminUsername} canViewApplications={isAdmin && adminUsername === "tsoofficial"} view={view} setView={setView} onLogout={handleLogout} onAdminLogout={handleAdminLogout} />
      {user && !isAdmin && (
        <div className="bg-violet-50 border-b border-violet-100 px-4 py-2.5">
          <div className="max-w-7xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <p className="text-xs sm:text-sm text-violet-900"><span className="font-black">🎉 New TSO Upgrade:</span> Credit Wallet, rewards, streaks and smarter package recommendations are now available.</p>
            <button type="button" onClick={() => setShowUpgradeAnnouncement(true)} className="shrink-0 text-xs font-black text-violet-700 hover:text-violet-900">View upgrade →</button>
          </div>
        </div>
      )}
      {toast && (
        <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 animate-floatIn">
          <div className="flex items-center gap-2 text-white px-4 py-2.5 rounded-full shadow-xl text-sm font-semibold" style={{ background: "linear-gradient(135deg, #1e1b6e 0%, #7c3aed 100%)" }}>
            <Star size={14} />{toast}
          </div>
        </div>
      )}
      <div className="flex-1">
        {view === "browse" && !selectedJob && !editingJob && (
          <Browse jobs={filteredJobs} total={jobs.length} loading={loadingJobs} search={search} setSearch={setSearch}
            categoryFilter={categoryFilter} setCategoryFilter={setCategoryFilter}
            typeFilter={typeFilter} setTypeFilter={setTypeFilter}
            remoteOnly={remoteOnly} setRemoteOnly={setRemoteOnly}
            onSelect={(job) => {
              setSelectedJob(job);
              window.history.pushState({ jobId: job.id }, "", `/jobs/${encodeURIComponent(job.id)}`);
              handleJobView(job.id);
            }} isAdmin={isAdmin} canDelete={adminUsername === "tsoofficial"} setView={setView} canBrowseAll={!!user || isAdmin}
            onEdit={(j) => { setEditingJob(j); setView("edit"); }} onDelete={handleDeleteJob} />
        )}
        {selectedJob && !editingJob && (
          <JobDetail job={selectedJob} onBack={() => { setSelectedJob(null); window.history.pushState({}, "", "/"); }} user={user} isAdmin={isAdmin} canDelete={adminUsername === "tsoofficial"}
            onApply={handleApply} hasApplied={userApplications.some((a) => a.jobId === selectedJob.id)}
            setView={setView} onEdit={(j) => setEditingJob(j)} onDelete={handleDeleteJob} />
        )}
        {view === "post" && !selectedJob && !editingJob && <PostJob isAdmin={isAdmin} user={user} onSubmit={handlePostJob} setView={setView} adminUsername={adminUsername} adminPassword={adminPassword} />}
        {view === "tasks" && !isAdmin && user && <Tasks user={user} onUserUpdated={setUser} setView={setView} />}
        {editingJob && <EditJob job={editingJob} onSubmit={handleUpdateJob} onCancel={() => setEditingJob(null)} onDelete={handleDeleteJob} canDelete={adminUsername === "tsoofficial"} adminUsername={adminUsername} adminPassword={adminPassword} />}
        {view === "users" && !selectedJob && !editingJob && isAdmin && <CreatorUserManagement adminUsername={adminUsername} adminPassword={adminPassword} isOwner={adminUsername === "tsoofficial"} onPasswordNotice={()=>{}} />}
        {view === "creator-tasks" && !selectedJob && !editingJob && isAdmin && <CreatorTaskManagement adminUsername={adminUsername} adminPassword={adminPassword} />}
        {view === "facebook-collector" && !selectedJob && !editingJob && isAdmin && <FacebookJobCollector adminUsername={adminUsername} adminPassword={adminPassword} onNotify={showToast} onJobsChanged={refreshJobs} />}
        {view === "tiktok-collector" && !selectedJob && !editingJob && isAdmin && <TikTokJobCollector adminUsername={adminUsername} adminPassword={adminPassword} onNotify={showToast} onJobsChanged={refreshJobs} />}
        {view === "feature-scout" && !selectedJob && !editingJob && isAdmin && <FeatureScout adminUsername={adminUsername} adminPassword={adminPassword} creatorToken={user?.token} onNotify={showToast} />}
        {view === "moderation" && !selectedJob && !editingJob && isAdmin && <JobModeration adminUsername={adminUsername} adminPassword={adminPassword} onNotify={showToast} onJobsChanged={refreshJobs} />}
        {view === "credit-moderation" && !selectedJob && !editingJob && isAdmin && <CreditModeration adminUsername={adminUsername} adminPassword={adminPassword} onNotify={showToast} />}
        {view === "turbo-moderation" && !selectedJob && !editingJob && isAdmin && <TurboModeration adminUsername={adminUsername} adminPassword={adminPassword} onNotify={showToast} />}
        {view === "dashboard" && !selectedJob && !editingJob && (
          isAdmin && adminUsername === "tsoofficial"
            ? <CreatorApplications jobs={jobs} applications={applications} adminUsername={adminUsername} adminPassword={adminPassword} onNotify={showToast}
                onApplicationUpdated={(updated) => setApplications((prev) => prev.map((a) => a.id === updated.id ? updated : a))} />
            : <Dashboard user={user} jobs={jobs} applications={userApplications} onSelectJob={setSelectedJob} />
        )}        {view === "mail" && !selectedJob && !editingJob && user && isAdmin && <Mail user={user} onNotify={showToast} />}
        {view === "profile" && !selectedJob && !editingJob && user && !isAdmin && <Profile user={user} onSaved={(u) => setUser({ ...u, token: user.token })} setView={setView} />}
        {view === "terms" && !selectedJob && !editingJob && <LegalPage type="terms" onBack={() => setView("auth")} />}
        {view === "privacy" && !selectedJob && !editingJob && <LegalPage type="privacy" onBack={() => setView("auth")} />}
        {view === "auth" && !selectedJob && !editingJob && <Auth onAuthed={handleAuthed} setView={setView} setAuthMode={setAuthMode} initialMode={authMode} />}
      </div>
      <TSOChat isAdmin={isAdmin} adminUsername={adminUsername} adminPassword={adminPassword} openSignal={openTSOSignal} />
      {upgradeBanner && user && !isAdmin && <button type="button" onClick={() => setShowUpgradeAnnouncement(true)} className="fixed bottom-5 right-5 z-[70] rounded-2xl bg-violet-700 text-white px-4 py-3 shadow-xl font-extrabold text-sm hover:bg-violet-800">🎉 TSO Upgrade · View features</button>}
      {showUpgradeAnnouncement && <UpgradeAnnouncement user={user} setView={setView} onClose={closeUpgradeAnnouncement} />}
      <Footer />
    </div>
  );
}

function Header({ user, isAdmin, adminUsername, canViewApplications, view, setView, onLogout, onAdminLogout }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const [creatorToolsOpen, setCreatorToolsOpen] = useState(false);

  const item = (label, icon, target, condition = true, compact = false) => condition && (
    <button type="button" onClick={() => { if (target === "mail" && user?.token) window.open("/edu/mail?token=" + encodeURIComponent(user.token), "_blank", "noopener,noreferrer"); else setView(target); setMenuOpen(false); setCreatorToolsOpen(false); }}
      className={`flex items-center gap-2 ${compact ? "px-3 py-2" : "px-3.5 py-2.5"} rounded-xl text-sm font-bold transition whitespace-nowrap ${view === target ? "bg-violet-50 text-violet-700" : "text-slate-600 hover:bg-slate-100"}`}>
      <Icon path={icon} size={16} />{label}
    </button>
  );

  const eduButton = (extraClass = "") => !!user && (
    <button type="button" onClick={() => { window.open("/edu/?token=" + encodeURIComponent(user.token), "_blank", "noopener,noreferrer"); setMenuOpen(false); }}
      className={`${extraClass} flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition`}>
      <Icon path="M12 3 2 8l10 5 8.5-4.25V17h1.5V8L12 3zM6 10.18v4.32c0 1.1 2.69 2.5 6 2.5s6-1.4 6-2.5v-4.32L12 13 6 10.18z" size={16} />Edu
    </button>
  );

  const creatorItems = [
    ["Applications", "M4 4h16v16H4zM8 9h8M8 13h5", "dashboard", !!canViewApplications],
    ["Feature Scout", "M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4", "feature-scout", true],
    ["FB Collector", "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z", "facebook-collector", true],
    ["Post Moderation", "M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z", "moderation", true],
    ["Credit", "M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6", "credit-moderation", true],
    ["Turbo", ICONS.bolt, "turbo-moderation", true],
    ["Tasks & Rewards", "M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11", "creator-tasks", true],
    ["Users", "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75", "users", true]
  ];
  const activeCreatorTool = creatorItems.some(([, , target, condition]) => condition && view === target);

  return (
    <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-xl border-b border-slate-200/70 shadow-sm">
      <div className="max-w-7xl mx-auto px-4 sm:px-5 py-2.5 flex items-center justify-between gap-3">
        <button onClick={() => { setView("browse"); setMenuOpen(false); setCreatorToolsOpen(false); }} className="flex items-center gap-2.5 shrink-0">
          <TSOMark size={38} />
          <div className="text-left leading-tight">
            <div className="font-extrabold text-[17px] tracking-tight"><span style={{color:"#151349"}}>Talent</span><span style={{color:"#7c3aed"}}>showoff</span></div>
            <div className="hidden xl:block text-[10px] font-bold tracking-wider text-slate-400 uppercase">Show your talent. Inspire the world.</div>
          </div>
        </button>

        <nav className="hidden lg:flex items-center gap-1.5">
          {isAdmin ? (
            <>
              {item("Overview", "M3 13h8V3H3v10zM13 21h8V11h-8v10zM3 21h8v-6H3v6zM13 9h8V3h-8v6z", "dashboard", true, true)}
              {item("Jobs", "M4 6h16v12H4zM8 6V4h8v2", "browse", true, true)}
              {item("Mail", "M4 4h16v16H4V4zm0 0 8 8 8-8", "mail", !!user, true)}
              <div className="relative">
                <button type="button" onClick={() => setCreatorToolsOpen(v => !v)}
                  className={`flex items-center gap-2 px-3 py-2 rounded-xl text-sm font-bold transition ${activeCreatorTool || creatorToolsOpen ? "bg-violet-50 text-violet-700" : "text-slate-600 hover:bg-slate-100"}`}>
                  <Icon path="M12 2l2.2 6.8H21l-5.5 4 2.1 6.8-5.6-4.1-5.6 4.1L8.5 13 3 8.8h6.8L12 2z" size={16} />Creator tools
                  <Icon path={creatorToolsOpen ? "M6 15l6-6 6 6" : "M6 9l6 6 6-6"} size={13} />
                </button>
                {creatorToolsOpen && (
                  <div className="absolute top-full left-0 mt-2 w-64 rounded-2xl border border-slate-200 bg-white shadow-xl p-2 z-50">
                    <div className="px-3 py-2 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Creator workspace</div>
                    <div className="grid gap-1">
                      {creatorItems.map(([label, icon, target, condition]) => item(label, icon, target, condition))}
                    </div>
                  </div>
                )}
              </div>
              {eduButton()}
              <button onClick={() => window.open("/tso-ai", "_blank", "noopener,noreferrer")} className="flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-bold text-violet-600 hover:bg-violet-50"><Sparkles size={15}/>TSO AI</button>
            </>
          ) : (
            <>
              {eduButton()}
              <button onClick={() => window.open("/tso-ai", "_blank", "noopener,noreferrer")} className="flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-sm font-bold text-violet-600 hover:bg-violet-50"><Sparkles size={15}/>TSO AI</button>
              {item("Dashboard", "M3 13h8V3H3v10zM13 21h8V11h-8v10zM3 21h8v-6H3v6zM13 9h8V3h-8v6z", "dashboard", !!user, true)}
              {item("Tasks", "M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11", "tasks", !!user, true)}
              {item("Profile", "M20 21a8 8 0 0 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z", "profile", !!user, true)}
            </>
          )}
        </nav>

        <div className="flex items-center gap-2">
          {(isAdmin || user) && <Button variant="primary" className="!px-3 !py-2.5 text-[13px] sm:text-sm !rounded-xl" onClick={() => { setView("post"); setMenuOpen(false); setCreatorToolsOpen(false); }}><span className="text-base leading-none">＋</span><span className="hidden sm:inline">New post</span><span className="sm:hidden">Post</span></Button>}
          {isAdmin ? <Badge tone="amber">Creator</Badge> : null}
          {user && !isAdmin ? (
            <button onClick={() => setView("profile")} className="hidden sm:flex items-center gap-2 px-2 py-1.5 rounded-xl hover:bg-slate-100" title="Open profile">
              {user.avatar ? <img src={user.avatar} alt="" className="w-8 h-8 rounded-full object-cover"/> : <div className="w-8 h-8 rounded-full bg-violet-100 text-violet-700 flex items-center justify-center text-xs font-bold">{(user.displayName || "?")[0].toUpperCase()}</div>}
              <span className="hidden xl:inline text-sm font-bold text-slate-700">{user.displayName || "Profile"}</span>
            </button>
          ) : null}
          <button type="button" aria-label="Open navigation menu" aria-expanded={menuOpen} onClick={() => setMenuOpen(v => !v)}
            className="lg:hidden w-10 h-10 rounded-xl border border-slate-200 bg-white flex items-center justify-center text-slate-700 hover:bg-slate-50">
            {menuOpen ? <Icon path="M6 6l12 12M18 6L6 18" size={19}/> : <Icon path="M4 6h16M4 12h16M4 18h16" size={19}/>} 
          </button>
          {isAdmin && <button type="button" onClick={onAdminLogout} className="hidden xl:inline-flex px-3 py-2.5 rounded-xl text-sm font-bold text-red-600 hover:bg-red-50">Sign out</button>}
          {user && !isAdmin && <button type="button" onClick={onLogout} className="hidden xl:inline-flex px-3 py-2.5 rounded-xl text-sm font-bold text-red-600 hover:bg-red-50">Sign out</button>}
          {!user && !isAdmin && <button onClick={() => setView("auth")} className="hidden sm:inline-flex px-3 py-2.5 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100">Sign in</button>}
        </div>
      </div>

      {menuOpen && (
        <div className="lg:hidden border-t border-slate-100 bg-white shadow-xl">
          <div className="max-w-7xl mx-auto p-3 space-y-3">
            {isAdmin ? (
              <>
                <div>
                  <div className="px-2 mb-1.5 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Main</div>

    const reader = new FileReader();

    reader.readAsDataURL(file);

  return (
    <div>
      <span className="block text-sm font-semibold text-slate-700 mb-1.5">CV / Resume <span className="text-red-500">*</span></span>

  );

/* ---------- Image upload field ---------- */
function ImageUploadField({ value, onChange }) {
  const inputRef = useRef(null);
  const [dragOver, setDragOver] = useState(false);

  function handleFile(file) {
    if (!file || !file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onerror = () => alert("Could not read that image. Please choose another file.");
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        // Compress large flyers before sending them as JSON so Publish works
        // reliably even with phone screenshots or high-resolution images.
        const maxSide = 1800;
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        onChange(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = () => alert("That image could not be processed. Please try JPG or PNG.");
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  return (
    <div>
      <span className="block text-sm font-semibold text-slate-700 mb-1.5">Job post image</span>
      {value ? (
        <div className="relative rounded-xl overflow-hidden border border-slate-200">
          <img src={value} alt="Job post preview" className="w-full max-h-96 object-contain bg-slate-50" />
          <button type="button" onClick={() => onChange(null)} className="absolute top-2 right-2 bg-white/95 hover:bg-white text-red-600 rounded-lg px-3 py-1.5 text-xs font-bold shadow">Remove</button>
        </div>
      ) : (
        <div
          onClick={() => inputRef.current && inputRef.current.click()}
          onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
          onDragLeave={() => setDragOver(false)}
          onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}
          className={`flex flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed px-6 py-10 text-center cursor-pointer transition ${dragOver ? "border-violet-500 bg-violet-50" : "border-slate-300 hover:border-violet-400 hover:bg-slate-50"}`}
        >
          <Icon path={ICONS.upload} size={28} className="text-violet-500" />
          <p className="text-sm font-bold text-slate-700">Click to upload or drag & drop</p>
          <p className="text-xs text-slate-400">PNG or JPG — the flyer/announcement image for this job</p>
        </div>
      )}
      <input ref={inputRef} type="file" accept="image/*" className="hidden" onChange={(e) => handleFile(e.target.files[0])} />
    </div>
  );
}

/* ---------- AI assistant: draft a post from a short brief ---------- */
function AIDraftHelper({ adminUsername, adminPassword, onApply }) {
  const [open, setOpen] = useState(false);
  const [brief, setBrief] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [draft, setDraft] = useState(null);

  async function generate() {
    if (!brief.trim()) return;
    setLoading(true); setError(""); setDraft(null);
    const res = await api("/ai/draft-post", { method: "POST", body: JSON.stringify({ brief, adminUsername, adminPassword }) });
    setLoading(false);
    if (res.ok) setDraft(res.draft);
    else setError(res.error || "Couldn't generate a draft.");
  }

  function useDraft() {
    onApply(draft);
    api("/ai/feedback", { method: "POST", body: JSON.stringify({ kind: "draft-post", note: "Creator accepted the AI draft as-is.", adminUsername, adminPassword }) });
    setOpen(false); setDraft(null); setBrief("");
  }

  return (
    <div className="rounded-2xl border border-violet-200 bg-violet-50/60 p-4 mb-5">
      <button type="button" onClick={() => setOpen(!open)} className="w-full flex items-center justify-between text-left">
        <span className="flex items-center gap-2 font-bold text-violet-800 text-sm"><Sparkles size={16} /> AI Assistant — draft this post for me</span>

/* ---------- Payment screenshot upload field (for Credit purchases) ---------- */
function PaymentScreenshotField({ value, onChange }) {
  const inputRef = useRef(null);
  const [dragOver, setDragOver] = useState(false);
  const [busy, setBusy] = useState(false);

  function handleFile(file) {
    if (!file || !file.type.startsWith("image/")) { alert("Please upload an image (screenshot) of your transfer."); return; }
    if (file.size > 8 * 1024 * 1024) { alert("Please upload a screenshot smaller than 8 MB."); return; }
    setBusy(true);
    const reader = new FileReader();
    reader.onerror = () => { setBusy(false); alert("Could not read that image. Please choose another file."); };
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxSide = 1600;
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        onChange(canvas.toDataURL("image/jpeg", 0.85));
        setBusy(false);
      };
      img.onerror = () => { setBusy(false); alert("That image could not be processed. Please try JPG or PNG."); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  return (
    <div>
      <span className="block text-sm font-semibold text-slate-700 mb-1.5">Payment screenshot</span>
      {value ? (
        <div className="relative rounded-xl overflow-hidden border border-slate-200">
          <img src={value} alt="Payment screenshot preview" className="w-full max-h-72 object-contain bg-slate-50" />
          <button type="button" onClick={() => onChange(null)} className="absolute top-2 right-2 bg-white/95 hover:bg-white text-red-600 rounded-lg px-3 py-1.5 text-xs font-bold shadow">Remove</button>
        </div>
      ) : (
        <div
          onClick={() => inputRef.current && inputRef.current.click()}
          onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
          onDragLeave={() => setDragOver(false)}
          onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}
          className={`flex flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed px-6 py-8 text-center cursor-pointer transition ${dragOver ? "border-violet-500 bg-violet-50" : "border-slate-300 hover:border-violet-400 hover:bg-slate-50"}`}
        >
          <Icon path={ICONS.upload} size={26} className="text-violet-500" />
          <p className="text-sm font-bold text-slate-700">{busy ? "Processing…" : "Click to upload or drag & drop"}</p>
          <p className="text-xs text-slate-400">Screenshot of your KBZ Pay / UAB Pay / AYA Pay transfer confirmation</p>
        </div>
      )}
      <input ref={inputRef} type="file" accept="image/*" className="hidden" onChange={(e) => handleFile(e.target.files[0])} />
    </div>
  );
}

function BuyCredit({ user, onPurchaseSubmitted, preferredPackageId, firstPurchaseBonusAvailable = false }) {
  const [info, setInfo] = useState(null);
  const [loadingInfo, setLoadingInfo] = useState(true);
  const [packageId, setPackageId] = useState(preferredPackageId || "");
  const [paymentMethod, setPaymentMethod] = useState("");
  const [screenshot, setScreenshot] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const [success, setSuccess] = useState("");
  const [purchases, setPurchases] = useState([]);
  const [loadingPurchases, setLoadingPurchases] = useState(true);

  async function loadInfo() {
    const res = await api("/credit/packages");
    if (res.ok) {
      setInfo(res);
      const ids = (res.packages || []).map(x => x.id);
      if (!packageId || !ids.includes(packageId)) setPackageId(preferredPackageId && ids.includes(preferredPackageId) ? preferredPackageId : (ids.includes("credit-50") ? "credit-50" : ids[0] || ""));
      if (!paymentMethod && res.paymentMethods.length) setPaymentMethod(res.paymentMethods[0]);
    }
    setLoadingInfo(false);
  }
  async function loadPurchases() {
    setLoadingPurchases(true);
    const res = await api("/credit/purchases?token=" + encodeURIComponent(user.token));
    if (res.ok) setPurchases(res.purchases || []);
    setLoadingPurchases(false);
  }
  async function syncBuyerBalance() {
    const res = await api("/credit/balance?token=" + encodeURIComponent(user.token));
    if (res.ok && typeof res.tsoCoins === "number") {
      // This is the authoritative server balance. It fixes the common case
      // where a creator approves a purchase while the buyer's old session is
      // still displaying the previous balance.
      if (typeof onPurchaseSubmitted === "function") onPurchaseSubmitted(res.tsoCoins);
    }
  }
  useEffect(() => {
    loadInfo(); loadPurchases(); syncBuyerBalance();
    const timer = setInterval(async () => { await loadPurchases(); await syncBuyerBalance(); }, 5000);
    return () => clearInterval(timer);
  }, [user.token]);
  useEffect(() => { if (preferredPackageId && info?.packages?.some(p => p.id === preferredPackageId)) setPackageId(preferredPackageId); }, [preferredPackageId, info]);

  async function submit(e) {
    e.preventDefault(); setError(""); setSuccess("");
    if (!packageId) return setError("Please choose a Credit package.");
    if (!paymentMethod) return setError("Please choose a payment method.");
    if (!screenshot) return setError("Please upload a screenshot of your payment transfer.");
    setSubmitting(true);
    const res = await api("/credit/purchases", { method: "POST", body: JSON.stringify({ token: user.token, packageId, paymentMethod, screenshot }) });
    setSubmitting(false);
    apiMutated("/credit/purchases");
    if (!res.ok) { setError(res.error || "Could not submit your Credit purchase."); return; }
    setSuccess(res.message || "Submitted! A creator will review your payment shortly.");
    setScreenshot(null); await loadPurchases(); await syncBuyerBalance();
  }
  const selectedPackage = info?.packages.find(p => p.id === packageId);
  const firstBonus = !!info?.firstPurchaseBonus && firstPurchaseBonusAvailable;
  return <div className="bg-white rounded-3xl border border-violet-100 p-6 shadow-sm">
    <div className="flex items-start justify-between gap-4 flex-wrap">
      <div><div className="inline-flex items-center gap-2 rounded-full bg-violet-100 text-violet-700 px-3 py-1 text-[10px] font-extrabold uppercase tracking-widest">💳 Credit Shop</div>
        <h2 className="text-2xl font-black mt-3">Choose how much you want to accomplish</h2>
        <p className="text-sm text-slate-500 mt-1">Use Credit flexibly for TSO Edu analysis, essay generation, job posting and more.</p></div>

/* ---------- Sign in / Sign up (real backend calls) ---------- */
// Users no longer choose a username at signup (it's only meaningful for
// creator accounts, which use it as their @talentshowoff.com mailbox).
// This mirrors the backend's unique_username_from() sanitisation so the
// derived value passes the same validation, without needing to be unique
// here — the server appends a suffix on collision.
function deriveUsername(email, displayName) {
  const seed = (email || "").split("@")[0] || displayName || "user";
  let base = seed.toLowerCase().replace(/[^a-z0-9_.]/g, "").replace(/^[._]+|[._]+$/g, "").slice(0, 28);
  if (base.length < 3) base = (base + "user").slice(0, 28);
  return base;
}

function Auth({ onAuthed, setView, setAuthMode, initialMode = "signin" }) {
  const [mode, setMode] = useState(initialMode);
  useEffect(() => { setMode(initialMode); }, [initialMode]); // signin | signup | forgot-question | forgot-reset | verify-email | verify-phone | google-phone
  const [loginEmail, setLoginEmail] = useState("");
  const [password, setPassword] = useState("");
  const [displayName, setDisplayName] = useState("");
  const [dateOfBirth, setDateOfBirth] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [googleClientId, setGoogleClientId] = useState("");
  const [email, setEmail] = useState("");
  const [phone, setPhone] = useState("");
  const [phoneCountry, setPhoneCountry] = useState("MM");
  const [phoneChallengeId, setPhoneChallengeId] = useState("");
  const [phoneSetupChallengeId, setPhoneSetupChallengeId] = useState("");
  const [googleCredential, setGoogleCredential] = useState("");
  const [googleUsername, setGoogleUsername] = useState("");
  const [securityQuestion, setSecurityQuestion] = useState("What was the name of your first school?");
  const [securityAnswer, setSecurityAnswer] = useState("");
  const [agreedToTerms, setAgreedToTerms] = useState(false);
  const [recoveryQuestion, setRecoveryQuestion] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [verificationUsername, setVerificationUsername] = useState("");
  const [referralCode, setReferralCode] = useState(() => new URLSearchParams(window.location.search).get("promode") || "");
  // Only one of email or phone verification is required to finish signup;
  // this picks which one is sent/prompted for first, and the person can
  // always switch to the other from the verification screen.
  const [verificationOrder, setVerificationOrder] = useState("email_first");
  const [twoFactorChallengeId, setTwoFactorChallengeId] = useState("");
  const [twoFactorMethod, setTwoFactorMethod] = useState("totp");
  const [twoFactorCode, setTwoFactorCode] = useState("");

  async function submitSignin(e) {
    e.preventDefault();
    setError(""); setLoading(true);
    const res = await api("/auth/signin", { method: "POST", body: JSON.stringify({ email: loginEmail, password }) });
    setLoading(false);
    if (res.ok && res.requiresTwoFactor) {
      setTwoFactorChallengeId(res.challengeId); setTwoFactorMethod(res.method); setTwoFactorCode("");
      setMode("2fa-verify"); setError("");
    }
    else if (res.ok) { passwordForUnifiedCreatorLogin = password; onAuthed({ ...res.user, token: res.token, dailyLoginReward: res.dailyLoginReward, phoneVerificationReward: res.phoneVerificationReward }); }
    else if (res.requiresPhone) { setVerificationUsername(res.username || ""); setPhoneSetupChallengeId(res.phoneSetupChallengeId || ""); setPhone(""); setPhoneCountry("MM"); setTwoFactorCode(""); setMode("phone-setup"); setError(""); }
    else if (res.needsVerification) { setVerificationUsername(res.loginEmail || loginEmail); setMode("verify-email"); setError(res.error || "Please verify your email first."); }
    else setError(res.error || "Sign in failed.");
  }

  async function submitTwoFactor(e) {
    e.preventDefault();
    setError(""); setLoading(true);
    const res = await api("/auth/2fa/verify", { method: "POST", body: JSON.stringify({ challengeId: twoFactorChallengeId, code: twoFactorCode }) });
    setLoading(false);
    if (res.ok) { passwordForUnifiedCreatorLogin = password; onAuthed({ ...res.user, token: res.token, dailyLoginReward: res.dailyLoginReward, phoneVerificationReward: res.phoneVerificationReward }); }
    else setError(res.error || "Incorrect code.");
  }

  async function submitSignup(e) {
    e.preventDefault();
    setError(""); setLoading(true);
    // The account key/username is no longer collected from the user (it's only
    // meaningful for creator accounts, which use it for their @talentshowoff.com
    // mailbox). Regular users sign in with their real email, so we derive a
    // reasonable internal username automatically from the email or display name.
    const derivedUsername = deriveUsername(email, displayName);
    const res = await api("/auth/signup", { method: "POST", body: JSON.stringify({ username: derivedUsername, password, displayName: displayName || derivedUsername, email, phone, phoneCountry, dateOfBirth, securityQuestion, securityAnswer, referralCode, source: "manual", agreedToTerms, termsVersion: TERMS_VERSION, privacyVersion: PRIVACY_VERSION, verificationOrder }) });
    setLoading(false);
    if (res.ok) {
      setVerificationUsername(res.user.username);
      setPhoneChallengeId(res.phoneChallengeId || "");
      // Only one channel needs to be verified to activate the account. Land
      // on whichever screen matches what was actually sent (falls back to
      // email if the phone code could not be delivered).
      setMode(res.needsPhoneVerification ? "verify-phone" : "verify-email");
      setError(res.warning || "");
    }
    else setError(res.error || "Sign up failed.");
  }

  async function submitPhoneSetup(e) {
    e.preventDefault();
    setError(""); setLoading(true);
    const res = await api("/auth/phone/start", { method: "POST", body: JSON.stringify({ challengeId: phoneSetupChallengeId, phone, phoneCountry }) });
    setLoading(false);
    if (res.ok) { setVerificationUsername(res.username || verificationUsername); setPhoneChallengeId(res.challengeId); setTwoFactorCode(""); setMode("verify-phone"); }
    else setError(res.error || "Could not send the phone verification code.");
  }

  async function submitPhoneVerification(e) {
    e.preventDefault();
    setError(""); setLoading(true);
    const res = await api("/auth/phone/verify", { method: "POST", body: JSON.stringify({ challengeId: phoneChallengeId, code: twoFactorCode }) });
    setLoading(false);
    if (res.ok) {
      setTwoFactorCode("");
      if (res.token) onAuthed({ ...res.user, token: res.token, dailyLoginReward: res.dailyLoginReward, phoneVerificationReward: res.phoneVerificationReward });
      else { setMode("verify-email"); setError("Phone verified. Please open the verification email to activate your account."); }
    } else setError(res.error || "Incorrect verification code.");
  }

  async function resendPhoneVerification() {
    setError(""); setLoading(true);
    const res = await api("/auth/phone/resend", { method: "POST", body: JSON.stringify({ username: verificationUsername || googleUsername }) });
    setLoading(false);
    if (res.ok) { setPhoneChallengeId(res.challengeId || phoneChallengeId); setError("A new phone verification code has been sent."); }
    else setError(res.error || "Could not resend the phone verification code.");
  }

  async function startGooglePhoneVerification(e) {
    e.preventDefault();
    setError(""); setLoading(true);
    const res = await api("/auth/google/phone/start", { method: "POST", body: JSON.stringify({ credential: googleCredential, phone, phoneCountry }) });
    setLoading(false);
    if (res.ok) { setGoogleUsername(res.username || googleUsername); setVerificationUsername(res.username || googleUsername); setPhoneChallengeId(res.challengeId); setTwoFactorCode(""); setMode("verify-phone"); }
    else setError(res.error || "Could not send the phone verification code.");
  }

  async function startForgot(e) {
    e.preventDefault(); setError(""); setLoading(true);
    const res = await api("/auth/forgot/question", { method: "POST", body: JSON.stringify({ email: loginEmail }) });
    setLoading(false);
    if (res.ok) { setRecoveryQuestion(res.question); setMode("forgot-reset"); }
    else setError(res.error || "Could not find that account.");
  }
  async function finishForgot(e) {
    e.preventDefault(); setError(""); setLoading(true);
    const res = await api("/auth/forgot/reset", { method: "POST", body: JSON.stringify({ email: loginEmail, securityAnswer, newPassword }) });
    setLoading(false);
    if (res.ok) { setMode("signin"); setPassword(""); setNewPassword(""); setSecurityAnswer(""); setError("Password reset successfully. You can sign in now."); }
    else setError(res.error || "Password reset failed.");
  }

  // Fetch the Google OAuth Client ID from the backend (kept out of the
  // frontend source so it can be changed in Render without redeploying).
  useEffect(() => {
    api("/auth/google-config").then((res) => { if (res.ok && res.clientId) setGoogleClientId(res.clientId); });
  }, []);

  // Render the real "Sign in with Google" button once the client ID is
  // known and Google's script has loaded. Handles both sign-in and sign-up
  // in one flow: Google verifies the email for us.
  const googleButtonRef = useRef(null);
  useEffect(() => {
    if (!googleClientId || !(mode === "signin" || mode === "signup")) return;

    const renderGoogleButton = () => {
      if (!window.google || !window.google.accounts || !window.google.accounts.id || !googleButtonRef.current) return false;
      window.google.accounts.id.initialize({
        client_id: googleClientId,
        callback: async (response) => {
          setError(""); setLoading(true);
          const res = await api("/auth/google", { method: "POST", body: JSON.stringify({ credential: response.credential, referralCode }) });
          setLoading(false);
          if (res.ok && res.requiresPhone) {
            setGoogleCredential(response.credential);
            setGoogleUsername(res.username || "");
            setVerificationUsername(res.username || "");
            setPhone(""); setPhoneCountry("MM"); setPhoneChallengeId(""); setTwoFactorCode("");
            setMode("google-phone"); setError("");
          } else if (res.ok) onAuthed({ ...res.user, token: res.token, dailyLoginReward: res.dailyLoginReward });
          else setError(res.error || "Google sign-in failed.");
        },
      });
      googleButtonRef.current.innerHTML = "";
      window.google.accounts.id.renderButton(googleButtonRef.current, {
        theme: "outline", size: "large", width: 320,
        text: mode === "signup" ? "signup_with" : "signin_with",
      });
      return true;
    };

    if (renderGoogleButton()) return;
    const timer = setInterval(() => {
      if (renderGoogleButton()) clearInterval(timer);
    }, 250);
    return () => clearInterval(timer);
  }, [googleClientId, mode]);

  return (
    <div className="tso-auth-page">
      <div className="tso-auth-bg tso-auth-bg-a" />
      <div className="tso-auth-bg tso-auth-bg-b" />
      <div className="tso-auth-shell">
        <section className="tso-auth-visual">
          <div className="tso-auth-stars" aria-hidden="true">
            <span className="tso-star tso-star-1">✦</span><span className="tso-star tso-star-2">✧</span><span className="tso-star tso-star-3">✦</span>
            <span className="tso-orb tso-orb-1" /><span className="tso-orb tso-orb-2" /><span className="tso-orb tso-orb-3" />
          </div>
          <div className="tso-auth-brand-card">
            <img src={LOGO_SRC} alt="Talentshowoff" className="tso-auth-logo" />
          </div>
          <div className="tso-auth-copy">
            <span className="tso-auth-eyebrow">YOUR TALENT. YOUR FUTURE.</span>
            <h2>Welcome back<span>.</span></h2>
            <p>Sign in and continue discovering opportunities that help your talent shine.</p>
          </div>
          <div className="tso-auth-orbit" aria-hidden="true"><span /><i>✦</i></div>
          <div className="tso-auth-plane" aria-hidden="true">➤</div>
          <div className="tso-auth-feature-row">
            <div><b>Discover</b><span>Find opportunities</span></div>
            <div><b>Connect</b><span>Build your profile</span></div>
            <div><b>Inspire</b><span>Show your talent</span></div>
          </div>

              {mode === "signup" && (

function resizeImageFile(file, maxSize = 512, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith("image/")) return reject(new Error("Not an image"));
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

      <input type="checkbox" checked={checked} onChange={(e) => onChange(e.target.checked)} className="mt-1 h-4 w-4 accent-violet-600" />
      <span className="text-sm text-slate-600 leading-6">
        I agree to the <button type="button" onClick={(e) => { e.preventDefault(); onTerms(); }} className="font-bold text-violet-600 hover:underline">Terms of Service</button> and <button type="button" onClick={(e) => { e.preventDefault(); onPrivacy(); }} className="font-bold text-violet-600 hover:underline">Privacy Policy</button>. I understand that an account will only be created after I accept both documents.
      </span>
    </label>
  );
}

function Mail({ user, onNotify }) {
  const [loading, setLoading] = useState(true);
  const [configured, setConfigured] = useState(true);
  const [hasMailbox, setHasMailbox] = useState(false);
  const [mailbox, setMailbox] = useState(null);
  const [localPart, setLocalPart] = useState("");
  const [settingUp, setSettingUp] = useState(false);
  const [setupError, setSetupError] = useState("");
  const [folders, setFolders] = useState([]);
  const [activeFolder, setActiveFolder] = useState("Inbox");
  const [messages, setMessages] = useState([]);
  const [loadingMessages, setLoadingMessages] = useState(false);
  const [selected, setSelected] = useState(null);
  const [composing, setComposing] = useState(false);
  const [search, setSearch] = useState("");
  const [checked, setChecked] = useState([]);
  const [showDetails, setShowDetails] = useState(true);
  const [showAccountPanel, setShowAccountPanel] = useState(false);

  const checkStatus = useCallback(async () => {
    setLoading(true);
    const res = await api("/mail/status", { headers: { Authorization: `Bearer ${user.token}` } });
    setLoading(false);
    if (!res.ok) return;
    setConfigured(res.configured);
    setHasMailbox(res.hasMailbox);
    if (res.hasMailbox) setMailbox(res.mailbox);
  }, [user.token]);

  useEffect(() => { checkStatus(); }, [checkStatus]);

  const loadFolders = useCallback(async () => {
    const res = await api("/mail/folders", { headers: { Authorization: `Bearer ${user.token}` } });
    if (res.ok) setFolders(res.folders);
  }, [user.token]);

  const loadMessages = useCallback(async (folderName) => {
    setLoadingMessages(true);
    const res = await api("/mail/messages?folder=" + encodeURIComponent(folderName), { headers: { Authorization: `Bearer ${user.token}` } });
    setLoadingMessages(false);
    if (res.ok) {
      setMessages(res.messages);
      setChecked([]);
    }
  }, [user.token]);

  useEffect(() => {
    if (hasMailbox) { loadFolders(); loadMessages(activeFolder); }
  }, [hasMailbox, loadFolders, loadMessages]);

  useEffect(() => {
    if (hasMailbox) loadMessages(activeFolder);
  }, [activeFolder, hasMailbox, loadMessages]);

  async function openMessage(id) {
    const res = await api("/mail/messages/" + id, { headers: { Authorization: `Bearer ${user.token}` } });
    if (res.ok) {
      setSelected(res.message);
      setMessages((prev) => prev.map((m) => m.id === id ? { ...m, isRead: true } : m));
      loadFolders();
    }
  }

  async function toggleStar(m, e) {
    e.stopPropagation();
    const next = !m.isStarred;
    setMessages((prev) => prev.map((x) => x.id === m.id ? { ...x, isStarred: next } : x));
    await api("/mail/messages/" + m.id + "/star", {
      method: "POST", headers: { Authorization: `Bearer ${user.token}` },
      body: JSON.stringify({ starred: next })
    });
  }

  async function toggleLabel(messageId, label) {
    const res = await api("/mail/messages/" + messageId + "/labels", {
      method: "POST", headers: { Authorization: `Bearer ${user.token}` },
      body: JSON.stringify({ label })
    });
    if (res.ok) {
      setSelected((prev) => prev && prev.id === messageId ? { ...prev, labels: res.labels } : prev);
      setMessages((prev) => prev.map((x) => x.id === messageId ? { ...x, labels: res.labels } : x));
    }
    return res;
  }

  async function moveMessage(id, folderName) {
    const res = await api("/mail/messages/" + id + "/move", {
      method: "POST", headers: { Authorization: `Bearer ${user.token}` },
      body: JSON.stringify({ folder: folderName })
    });
    if (res.ok) {
      setSelected(null);
      onNotify(`Moved to ${folderName}.`);
      loadMessages(activeFolder);
      loadFolders();
    }
  }

  async function bulkMove(folderName) {
    if (!checked.length) return;
    for (const id of checked) {
      await api("/mail/messages/" + id + "/move", {
        method: "POST", headers: { Authorization: `Bearer ${user.token}` },
        body: JSON.stringify({ folder: folderName })
      });
    }
    setChecked([]);
    setSelected(null);
    onNotify(`${checked.length} message${checked.length === 1 ? "" : "s"} moved to ${folderName}.`);
    loadMessages(activeFolder);
    loadFolders();
  }

  async function setupMailbox(e) {
    e.preventDefault();
    setSetupError("");
    setSettingUp(true);
    const res = await api("/mail/setup", {
      method: "POST", headers: { Authorization: `Bearer ${user.token}` },
      body: JSON.stringify({ localPart })
    });
    setSettingUp(false);
    if (res.ok) {
      setHasMailbox(true);
      setMailbox(res.mailbox);
      onNotify(`Mailbox created: ${res.mailbox.address}`);
    } else setSetupError(res.error || "Could not create your mailbox.");
  }

  const unreadCount = messages.filter(m => !m.isRead).length;
  const starredCount = messages.filter(m => m.isStarred).length;
  const visibleMessages = messages.filter((m) => {
    const q = search.trim().toLowerCase();
    if (!q) return true;
    return [m.fromName, m.fromAddress, m.subject, m.preview].some(v => String(v || "").toLowerCase().includes(q));
  });

  const folderIcon = (name) => ({
    Inbox: "✉", Starred: "★", Snoozed: "◷", Sent: "➤", Drafts: "▱",
    Spam: "!", Trash: "♜", Important: "›", "All Mail": "▤"
  }[name] || "▱");
  const folderDisplayName = (name) => name && name.startsWith("Label:") ? name.slice(6) + " label" : name;

  if (loading) return (
    <div className="flex items-center justify-center py-24">
      <div className="w-9 h-9 rounded-full border-2 animate-spin" style={{ borderColor:"#dbeafe", borderTopColor:"#2563eb" }} />
    </div>
  );

  if (!configured) return (
    <div className="max-w-2xl mx-auto px-5 py-16 text-center">
      <img src="/mail-logo.jpg" alt="" className="w-16 h-16 rounded-2xl object-cover shadow-sm mx-auto mb-5" />
      <h1 className="text-2xl font-extrabold text-slate-900">TSO Mail isn't set up yet</h1>
      <p className="text-sm text-slate-500 mt-2">The site owner hasn't configured mail on this deployment yet.</p>
    </div>
  );

  if (!hasMailbox) return (
    <div className="max-w-lg mx-auto px-5 py-16">
      <div className="text-center mb-6">
        <img src="/mail-logo.jpg" alt="" className="w-16 h-16 rounded-2xl object-cover shadow-sm mx-auto mb-5" />
        <span className="inline-block text-[11px] font-extrabold tracking-widest uppercase text-blue-700 bg-blue-50 rounded-full px-3 py-1 mb-3">TSO Mail</span>
        <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">Create your Talentshowoff mailbox</h1>
        <p className="text-sm text-slate-500 mt-2">Get your @talentshowoff.com address and use the full TSO Mail workspace.</p>
      </div>
      <form onSubmit={setupMailbox} className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
        <TextField label="Choose your mailbox name" value={localPart} onChange={(e) => setLocalPart(e.target.value.toLowerCase())}
          placeholder={user.username} hint="Example: yourname@talentshowoff.com" />
        {setupError && <div className="text-sm font-semibold text-red-600">{setupError}</div>}
        <Button type="submit" variant="primary" disabled={settingUp} className="w-full">{settingUp ? "Creating…" : "Create mailbox"}</Button>
      </form>
    </div>
  );

  return (
    <div className="w-full min-h-[calc(100vh-90px)] bg-slate-50/70">
      <div className="max-w-[1500px] mx-auto p-2 sm:p-4 lg:p-5">
        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
          <div className="h-[70px] flex items-center gap-3 px-3 sm:px-5 border-b border-slate-200">
            <div className="flex items-center gap-2.5 shrink-0">
              <img src="/mail-logo.jpg" alt="" className="w-9 h-9 rounded-xl object-cover" />
              <div className="hidden sm:block text-xl font-extrabold text-slate-800">TSO Mail</div>
            </div>
            <div className="flex-1 max-w-[680px] mx-auto relative">
              <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">⌕</span>
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search mail"
                className="w-full h-11 rounded-full bg-slate-100 border border-transparent pl-11 pr-12 text-sm text-slate-800 outline-none focus:bg-white focus:border-blue-200 focus:ring-4 focus:ring-blue-50" />
              <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm">☷</span>
            </div>
            <div className="flex md:hidden items-center relative shrink-0">
              <button type="button" onClick={() => setShowAccountPanel(v => !v)} title="Account"
                className="w-8 h-8 rounded-full bg-blue-600 text-white text-xs font-bold flex items-center justify-center">
                {(user.displayName || user.email || "U").charAt(0).toUpperCase()}
              </button>
              {showAccountPanel && (
                <>
                  <div className="fixed inset-0 z-40" onClick={() => setShowAccountPanel(false)} />
                  <div className="absolute right-0 top-11 z-50 w-64 bg-white rounded-2xl border border-slate-200 shadow-lg p-4">
                    <div className="flex items-center gap-3 pb-3 border-b border-slate-100">
                      <div className="w-10 h-10 rounded-full bg-blue-600 text-white text-sm font-bold flex items-center justify-center">
                        {(user.displayName || user.email || "U").charAt(0).toUpperCase()}
                      </div>
                      <div className="min-w-0">
                        <div className="text-sm font-bold text-slate-800 truncate">{user.displayName || "Your account"}</div>
                        <div className="text-xs text-slate-500 truncate">{mailbox?.address || user.email}</div>
                      </div>
                    </div>
                    <div className="pt-3 space-y-1">
                      <button type="button" onClick={() => setShowAccountPanel(false)}
                        className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-50">Mail settings</button>
                      <button type="button" onClick={() => setShowAccountPanel(false)}
                        className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-50">Sign out</button>
                    </div>
                  </div>
                </>
              )}
            </div>
            <div className="hidden md:flex items-center gap-3 text-slate-500 relative">
              <button type="button" title="Help" className="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center">?</button>
              <button type="button" title="Settings" onClick={() => setShowAccountPanel(v => !v)}
                className="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center">⚙</button>
              <button type="button" title="Apps" className="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center">⠿</button>
              <button type="button" onClick={() => setShowAccountPanel(v => !v)} title="Account"
                className="w-8 h-8 rounded-full bg-blue-600 text-white text-xs font-bold flex items-center justify-center">
                {(user.displayName || user.email || "U").charAt(0).toUpperCase()}
              </button>
              {showAccountPanel && (
                <>
                  <div className="fixed inset-0 z-40" onClick={() => setShowAccountPanel(false)} />
                  <div className="absolute right-0 top-11 z-50 w-72 bg-white rounded-2xl border border-slate-200 shadow-lg p-4">
                    <div className="flex items-center gap-3 pb-3 border-b border-slate-100">
                      <div className="w-10 h-10 rounded-full bg-blue-600 text-white text-sm font-bold flex items-center justify-center">
                        {(user.displayName || user.email || "U").charAt(0).toUpperCase()}
                      </div>
                      <div className="min-w-0">
                        <div className="text-sm font-bold text-slate-800 truncate">{user.displayName || "Your account"}</div>
                        <div className="text-xs text-slate-500 truncate">{mailbox?.address || user.email}</div>
                      </div>
                    </div>
                    <div className="pt-3 space-y-1">
                      <button type="button" onClick={() => setShowAccountPanel(false)}
                        className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-50">Mail settings</button>
                      <button type="button" onClick={() => setShowAccountPanel(false)}
                        className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-50">Sign out</button>
                    </div>
                  </div>
                </>
              )}
            </div>
          </div>

          <div className="flex min-h-[680px]">
            <aside className="hidden lg:block w-[230px] shrink-0 bg-white border-r border-slate-200 p-3">
              <button onClick={() => { setComposing(true); setSelected(null); }}
                className="w-full h-12 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold flex items-center justify-center gap-2 shadow-sm mb-4">
                <span className="text-lg">✎</span> Compose
              </button>
              <div className="space-y-1">
                {folders.map(f => (
                  <button key={f.id} onClick={() => { setActiveFolder(f.name); setSelected(null); setComposing(false); }}
                    className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm ${activeFolder === f.name ? "bg-blue-50 text-blue-700 font-bold" : "text-slate-600 hover:bg-slate-50"}`}>
                    <span className="flex items-center gap-3"><span className="w-5 text-center">{folderIcon(f.name)}</span>{f.name}</span>
                    {f.unread > 0 && <span className="text-xs font-bold">{f.unread}</span>}
                  </button>
                ))}
                <button onClick={() => { setActiveFolder("Starred"); setSelected(null); }} className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm ${activeFolder === "Starred" ? "bg-blue-50 text-blue-700 font-bold" : "text-slate-600 hover:bg-slate-50"}`}>
                  <span className="flex items-center gap-3"><span className="w-5 text-center">★</span>Starred</span>
                  {starredCount > 0 && <span className="text-xs font-bold">{starredCount}</span>}
                </button>
              </div>
              <div className="mt-6 px-3 text-[11px] font-bold uppercase tracking-wider text-slate-400">Labels <span className="float-right text-base">+</span></div>
              <div className="mt-2 space-y-1 text-sm text-slate-600">
                {[["Work", "🔵"], ["Personal", "🟢"], ["Projects", "🟠"]].map(([name, dot]) => (
                  <button key={name} type="button"
                    onClick={() => { setActiveFolder("Label:" + name); setSelected(null); setComposing(false); }}
                    className={`w-full text-left px-3 py-2 rounded-lg ${activeFolder === "Label:" + name ? "bg-blue-50 text-blue-700 font-bold" : "hover:bg-slate-50"}`}>
                    {dot} {name}
                  </button>
                ))}

              <div className="mt-8 px-3 text-xs text-slate-400">{mailbox?.address}</div>
